      <stop offset="1" stop-color="#040b18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff0ff"/>
      <stop offset=".55" stop-color="#22c3e6"/>
      <stop offset="1" stop-color="#e3b04b"/>
