<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-labelledby="t d">
  <title id="t">AldenirMed 360X (fundo claro)</title>
  <desc id="d">Logotipo horizontal: emblema orbital com cruz clínica e órbita 360°, seguido do nome AldenirMed e do selo 360X.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
