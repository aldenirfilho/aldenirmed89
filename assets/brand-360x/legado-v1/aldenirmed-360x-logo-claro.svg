    <circle cx="64" cy="66" r="43" fill="none" stroke="url(#ring)" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="248 22" transform="rotate(-62 64 66)"/>
    <path d="M64 17 L32 106 L64 86 Z" fill="url(#wingL)"/>
