<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t21 d21">
<title id="t21">Onde está o sangue? Quatro compartimentos na TC de crânio (esquema vetorial)</title>
<desc id="d21">Quatro esquemas axiais: hemorragia subaracnóidea preenchendo sulcos, fissuras silvianas e cisternas basais; hemorragia intracerebral no parênquima com extensão ventricular; hematoma subdural em crescente sob o osso; hematoma epidural biconvexo limitado pelas suturas.</desc>
<defs>
 <style>
  .bg{fill:#081321}.title{font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf4fa}.accent{fill:#4de0c2}
  .lab{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf4fa}.sub{font:400 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#adc0d4}
  .foot{font:600 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ffcb77}.small{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#adc0d4}
  .bone{fill:#e8e1d2}.csf{fill:#101c2c}.brain{fill:#c9d2de}.gyr{fill:none;stroke:#8f9db0;stroke-width:3;stroke-linecap:round}
  .vent{fill:#22354d}.blood{fill:#d8323a}.bloodline{fill:none;stroke:#d8323a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .suture{stroke:#6b5f4b;stroke-width:5;fill:none;stroke-linecap:round}
 </style>
 <symbol id="head" viewBox="-170 -200 340 400">
  <ellipse class="bone" cx="0" cy="0" rx="165" ry="195"/>
  <ellipse class="csf" cx="0" cy="0" rx="146" ry="176"/>
  <ellipse class="brain" cx="0" cy="0" rx="138" ry="168"/>
  <path class="gyr" d="M0 -166 V-78 M0 78 V166"/>
  <path class="gyr" d="M-125 -95 q22 10 30 40 M-135 -40 q26 4 40 30 M-136 20 q26 -4 40 -30 M-125 80 q22 -10 32 -42 M-95 -140 q6 22 26 34 M-60 -158 q0 24 14 40 M-60 158 q0 -24 14 -40 M-95 140 q6 -22 26 -34"/>
  <path class="gyr" d="M125 -95 q-22 10 -30 40 M135 -40 q-26 4 -40 30 M136 20 q-26 -4 -40 -30 M125 80 q-22 -10 -32 -42 M95 -140 q-6 22 -26 34 M60 -158 q0 24 -14 40 M60 158 q0 -24 -14 -40 M95 140 q-6 -22 -26 -34"/>
  <path class="gyr" d="M-120 -8 q34 -12 64 -8 M120 -8 q-34 -12 -64 -8"/>
  <path class="vent" d="M-52 -78 c-18 2 -24 34 -18 74 c4 22 14 32 30 26 c8 -32 6 -64 -2 -94 c-2 -5 -6 -7 -10 -6z"/>
  <path class="vent" d="M52 -78 c18 2 24 34 18 74 c-4 22 -14 32 -30 26 c-8 -32 -6 -64 2 -94 c2 -5 6 -7 10 -6z"/>
  <rect class="vent" x="-6" y="-10" width="12" height="50" rx="5"/>
 </symbol>
</defs>
<rect class="bg" width="1600" height="900"/>
<text class="title" x="800" y="72" text-anchor="middle">Onde está o <tspan class="accent">sangue</tspan>? Quatro compartimentos na TC</text>
<text class="sub" x="800" y="108" text-anchor="middle">Esquema vetorial didático — não é tomografia real. O padrão de distribuição revela o compartimento; o compartimento muda a conduta.</text>

<!-- Painel A: HSA -->
<g transform="translate(60 150)">
 <use href="#head" x="0" y="0" width="340" height="400"/>
 <g transform="translate(170 200)">
  <!-- estrela cisternal (suprasselar) -->
  <path class="blood" d="M0 40 l9 18 20 3 -14 14 3 20 -18 -10 -18 10 3 -20 -14 -14 20 -3z"/>
  <path class="bloodline" d="M-16 72 q-20 6 -34 22 M16 72 q20 6 34 22 M0 84 v30"/>
  <!-- fissuras silvianas e inter-hemisférica -->
  <path class="bloodline" d="M-120 -8 q34 -12 64 -8 M120 -8 q-34 -12 -64 -8 M0 -166 V-100"/>
  <!-- sangue nos sulcos da convexidade -->
  <path class="bloodline" d="M-125 -95 q22 10 30 40 M-135 -40 q26 4 40 30 M125 -95 q-22 10 -30 40 M95 -140 q-6 22 -26 34 M-60 -158 q0 24 14 40 M136 20 q-26 -4 -40 -30 M-136 20 q26 -4 40 -30 M60 158 q0 -24 -14 -40 M0 166 V110"/>
 </g>
 <text class="lab" x="170" y="440" text-anchor="middle">HSA aneurismática</text>
 <text class="sub" x="170" y="472" text-anchor="middle">Sangue desenha sulcos, fissuras</text>
 <text class="sub" x="170" y="498" text-anchor="middle">silvianas e cisternas basais</text>
 <text class="sub" x="170" y="524" text-anchor="middle">(entre aracnoide e pia-máter)</text>
</g>

<!-- Painel B: HIC -->
<g transform="translate(440 150)">
 <use href="#head" x="0" y="0" width="340" height="400"/>
 <g transform="translate(170 200)">
  <!-- hematoma profundo (núcleos da base) -->
  <path class="blood" d="M66 -30 q42 -22 66 14 q16 32 -10 56 q-36 24 -66 -2 q-26 -32 10 -68z"/>
  <!-- extensão para o ventrículo lateral direito -->
  <path class="blood" d="M52 -78 c18 2 24 34 18 74 c-4 22 -14 32 -30 26 c-8 -32 -6 -64 2 -94 c2 -5 6 -7 10 -6z" opacity=".92"/>
 </g>
 <text class="lab" x="170" y="440" text-anchor="middle">Hemorragia intracerebral</text>
 <text class="sub" x="170" y="472" text-anchor="middle">Coleção no parênquima;</text>
 <text class="sub" x="170" y="498" text-anchor="middle">pode invadir os ventrículos</text>
 <text class="sub" x="170" y="524" text-anchor="middle">(ABC/2 · expansão · ICH Score)</text>
</g>

<!-- Painel C: Subdural -->
<g transform="translate(820 150)">
 <use href="#head" x="0" y="0" width="340" height="400"/>
 <g transform="translate(170 200)">
  <!-- crescente: convexo para fora, côncavo para o cérebro, cruza a sutura -->
  <path class="blood" d="M104 -128 q54 60 50 130 q-4 66 -44 122 q-10 -60 -6 -122 q4 -70 0 -130z"/>
  <!-- marcas de sutura na tábua óssea -->
  <path class="suture" d="M148 -84 l14 -6 M148 84 l14 6"/>
 </g>
 <text class="lab" x="170" y="440" text-anchor="middle">Hematoma subdural</text>
 <text class="sub" x="170" y="472" text-anchor="middle">Crescente sob o osso, côncavo</text>
 <text class="sub" x="170" y="498" text-anchor="middle">para o cérebro, cruza suturas</text>
 <text class="sub" x="170" y="524" text-anchor="middle">— extra-axial, não é HSA</text>
</g>

<!-- Painel D: Epidural -->
<g transform="translate(1200 150)">
 <use href="#head" x="0" y="0" width="340" height="400"/>
 <g transform="translate(170 200)">
  <!-- lente biconvexa entre as suturas -->
  <path class="blood" d="M124 -84 q64 84 0 168 q-40 -84 0 -168z"/>
  <path class="suture" d="M152 -86 l14 -4 M152 86 l14 4"/>
 </g>
 <text class="lab" x="170" y="440" text-anchor="middle">Hematoma epidural</text>
 <text class="sub" x="170" y="472" text-anchor="middle">Lente biconvexa limitada</text>
 <text class="sub" x="170" y="498" text-anchor="middle">pelas suturas; contexto de</text>
 <text class="sub" x="170" y="524" text-anchor="middle">trauma — não é HSA nem HIC</text>
</g>

<rect x="170" y="716" width="1260" height="96" rx="18" fill="#132a44" stroke="#4de0c2" stroke-width="3"/>
<text class="foot" x="800" y="754" text-anchor="middle">Sangue que desenha os sulcos = subaracnóideo · Faixa lisa sob o osso = extra-axial (subdural/epidural)</text>
<text class="small" x="800" y="790" text-anchor="middle">Nas figuras 03 e 13 desta edição, a HSA aparece simplificada como faixa sob a calota; este esquema corrige a leitura anatômica.</text>
<text class="small" x="800" y="860" text-anchor="middle">TURBO TEMI • NEUROINTENSIVISMO • Figura 21 (vetor nativo, edição 1.1)</text>
</svg>
