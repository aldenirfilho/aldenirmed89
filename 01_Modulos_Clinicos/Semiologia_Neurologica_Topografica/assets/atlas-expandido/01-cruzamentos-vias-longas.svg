<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto" lang="pt-BR">
<title id="title">Onde as vias longas cruzam?</title><desc id="desc">Esquema de três vias do corpo. A maior parte do trato corticoespinhal cruza no bulbo e desce no lado oposto. A informação de vibração e posição sobe pelo cordão posterior no mesmo lado e cruza no bulbo. A via espinotalâmica de dor e temperatura cruza na medula, poucos segmentos após entrar, e então sobe contralateralmente. O desenho simplifica sinapses, vias paralelas e anatomia tridimensional.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}</style>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#176f70"/></marker>
<marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#bb562c"/></marker>
<marker id="arrow-lav" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#755994"/></marker></defs>
<rect width="1200" height="820" fill="#f5f1e8"/><text x="40" y="40" font-size="15" font-weight="700" fill="#176f70" text-anchor="start">TURBO TEMI 360 X  /  ATLAS 01</text><text x="40" y="83" font-size="35" font-weight="700" fill="#183132" text-anchor="start">Onde as vias longas cruzam?</text><text x="40" y="114" font-size="19" font-weight="400" fill="#49625f" text-anchor="start">Siga a seta. Primeiro encontre o cruzamento; depois interprete o lado do déficit.</text><rect x="40" y="145" width="360" height="510" rx="18" fill="#fffdf8" stroke="#d4ded4"/><rect x="57" y="161" width="6" height="57" rx="3" fill="#176f70" stroke="#176f70"/><text x="75" y="185" font-size="25" font-weight="700" fill="#183132" text-anchor="start">Corticoespinhal</text><text x="75" y="211" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Movimento voluntário</text><text x="75" y="234" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Trajeto principal: via lateral</text><text x="170" y="267" font-size="14" font-weight="700" fill="#49625f" text-anchor="middle">ESQ.</text><text x="327" y="267" font-size="14" font-weight="700" fill="#49625f" text-anchor="middle">DIR.</text><line x1="249" y1="280" x2="249" y2="603" stroke="#d4ded4" stroke-dasharray="5 6"/><rect x="54" y="277" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="65" y="305" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Córtex</text><rect x="54" y="387" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="65" y="415" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Bulbo</text><rect x="54" y="545" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="65" y="573" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Medula</text><line x1="249" y1="280" x2="249" y2="603" stroke="#d4ded4" stroke-dasharray="5 6"/><path d="M170 308 V376 C170 398 327 422 327 447 V582" fill="none" stroke="#176f70" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="170" cy="299" r="9" fill="#176f70" stroke="none" stroke-width="1"/><rect x="129" y="468" width="255" height="50" rx="8" fill="#dcebea" stroke="none"/><text x="141" y="489" font-size="15" font-weight="700" fill="#176f70" text-anchor="start">A maioria cruza no bulbo</text><text x="141" y="509" font-size="15" font-weight="700" fill="#176f70" text-anchor="start">(decussação das pirâmides)</text><text x="220" y="634" font-size="16" font-weight="700" fill="#176f70" text-anchor="middle">Comando: córtex → músculo</text><rect x="420" y="145" width="360" height="510" rx="18" fill="#fffdf8" stroke="#d4ded4"/><rect x="437" y="161" width="6" height="57" rx="3" fill="#755994" stroke="#755994"/><text x="455" y="185" font-size="25" font-weight="700" fill="#183132" text-anchor="start">Cordão posterior</text><text x="455" y="211" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Vibração • posição • tato fino</text><text x="455" y="234" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Continua como lemnisco medial</text><text x="550" y="267" font-size="14" font-weight="700" fill="#49625f" text-anchor="middle">ESQ.</text><text x="707" y="267" font-size="14" font-weight="700" fill="#49625f" text-anchor="middle">DIR.</text><line x1="629" y1="280" x2="629" y2="603" stroke="#d4ded4" stroke-dasharray="5 6"/><rect x="434" y="277" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="445" y="305" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Córtex</text><rect x="434" y="387" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="445" y="415" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Bulbo</text><rect x="434" y="545" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="445" y="573" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Medula</text><line x1="629" y1="280" x2="629" y2="603" stroke="#d4ded4" stroke-dasharray="5 6"/><path d="M550 594 V446 C550 423 707 399 707 374 V312" fill="none" stroke="#755994" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-lav)"/><circle cx="550" cy="595" r="9" fill="#755994" stroke="none" stroke-width="1"/><rect x="509" y="468" width="255" height="50" rx="8" fill="#eae2f1" stroke="none"/><text x="521" y="489" font-size="15" font-weight="700" fill="#755994" text-anchor="start">Cruza no bulbo</text><text x="521" y="509" font-size="15" font-weight="700" fill="#755994" text-anchor="start">Após núcleos grácil/cuneato</text><text x="600" y="634" font-size="16" font-weight="700" fill="#755994" text-anchor="middle">Sensação: corpo → córtex</text><rect x="800" y="145" width="360" height="510" rx="18" fill="#fffdf8" stroke="#d4ded4"/><rect x="817" y="161" width="6" height="57" rx="3" fill="#bb562c" stroke="#bb562c"/><text x="835" y="185" font-size="25" font-weight="700" fill="#183132" text-anchor="start">Espinotalâmica</text><text x="835" y="211" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Dor e temperatura</text><text x="835" y="234" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Componente do sistema anterolateral</text><text x="930" y="267" font-size="14" font-weight="700" fill="#49625f" text-anchor="middle">ESQ.</text><text x="1087" y="267" font-size="14" font-weight="700" fill="#49625f" text-anchor="middle">DIR.</text><line x1="1009" y1="280" x2="1009" y2="603" stroke="#d4ded4" stroke-dasharray="5 6"/><rect x="814" y="277" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="825" y="305" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Córtex</text><rect x="814" y="387" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="825" y="415" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Bulbo</text><rect x="814" y="545" width="332" height="49" rx="8" fill="#edf0e8" stroke="none"/><text x="825" y="573" font-size="16" font-weight="700" fill="#49625f" text-anchor="start">Medula</text><line x1="1009" y1="280" x2="1009" y2="603" stroke="#d4ded4" stroke-dasharray="5 6"/><path d="M930 594 V570 C930 548 1087 537 1087 510 V312" fill="none" stroke="#bb562c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/><circle cx="930" cy="595" r="9" fill="#bb562c" stroke="none" stroke-width="1"/><rect x="889" y="444" width="255" height="50" rx="8" fill="#fae3d5" stroke="none"/><text x="901" y="465" font-size="15" font-weight="700" fill="#bb562c" text-anchor="start">Cruza na medula</text><text x="901" y="485" font-size="15" font-weight="700" fill="#bb562c" text-anchor="start">Poucos segmentos após entrar</text><text x="980" y="634" font-size="16" font-weight="700" fill="#bb562c" text-anchor="middle">Sensação: corpo → córtex</text><rect x="40" y="675" width="1120" height="82" rx="14" fill="#e5ebe1" stroke="none"/><text x="62" y="704" font-size="20" font-weight="700" fill="#183132" text-anchor="start">LESÃO DE UMA HEMIMEDULA: o que fica abaixo do nível?</text><text x="62" y="734" font-size="18" font-weight="400" fill="#183132" text-anchor="start">Força + vibração/posição: mesmo lado. Dor/temperatura: lado oposto, com defasagem segmentar.</text><text x="40" y="782" font-size="14" font-weight="400" fill="#49625f" text-anchor="start">Esquema do corpo, sem escala. Não representa as vias da face. Sinapses e trajetos paralelos foram simplificados.</text><text x="40" y="802" font-size="14" font-weight="400" fill="#49625f" text-anchor="start">Fontes: UTHealth — Neuroanatomy Online (Lab 6) e Neuroscience Online (cap. 4).</text></svg>