<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto" lang="pt-BR">
<title id="title">Afasias: três perguntas organizam o exame</title><desc id="desc">Matriz didática de fluência, compreensão e repetição nas afasias clássicas. Broca: não fluente, compreensão relativamente preservada, repetição comprometida. Wernicke: fluente, compreensão e repetição comprometidas. Condução: fluente, compreensão relativamente preservada e repetição comprometida. Global: não fluente, compreensão e repetição comprometidas. Transcortical motora: não fluente, compreensão e repetição relativamente preservadas. Transcortical sensorial: fluente, compreensão comprometida, repetição relativamente preservada. Transcortical mista: não fluente, compreensão comprometida, repetição relativamente preservada. Anômica: fluente, compreensão e repetição relativamente preservadas, dificuldade de nomeação. As categorias são protótipos clínicos e não localizam sozinhas uma lesão.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}</style>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#176f70"/></marker>
<marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#bb562c"/></marker>
<marker id="arrow-lav" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#755994"/></marker></defs>
<rect width="1200" height="820" fill="#f5f1e8"/><text x="40" y="40" font-size="15" font-weight="700" fill="#176f70" text-anchor="start">TURBO TEMI 360 X  /  ATLAS 03</text><text x="40" y="83" font-size="35" font-weight="700" fill="#183132" text-anchor="start">Afasias: três perguntas organizam o exame</text><text x="40" y="114" font-size="19" font-weight="400" fill="#49625f" text-anchor="start">Avalie também nomeação, leitura e escrita. Afasia é alteração da linguagem; disartria afeta a execução da fala.</text><rect x="40" y="138" width="360" height="110" rx="18" fill="#fffdf8" stroke="#d4ded4"/><circle cx="73" cy="169" r="17" fill="#176f70" stroke="none" stroke-width="1"/><text x="73" y="175" font-size="18" font-weight="700" fill="#fffdf8" text-anchor="middle">1</text><text x="101" y="176" font-size="19" font-weight="700" fill="#176f70" text-anchor="start">FLUÊNCIA</text><text x="60" y="207" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Fala espontânea: esforço, frases</text><text x="60" y="231" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">e conteúdo informativo.</text><rect x="420" y="138" width="360" height="110" rx="18" fill="#fffdf8" stroke="#d4ded4"/><circle cx="453" cy="169" r="17" fill="#755994" stroke="none" stroke-width="1"/><text x="453" y="175" font-size="18" font-weight="700" fill="#fffdf8" text-anchor="middle">2</text><text x="481" y="176" font-size="19" font-weight="700" fill="#755994" text-anchor="start">COMPREENSÃO</text><text x="440" y="207" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Comandos e perguntas graduados.</text><text x="440" y="231" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Confirme audição e atenção.</text><rect x="800" y="138" width="360" height="110" rx="18" fill="#fffdf8" stroke="#d4ded4"/><circle cx="833" cy="169" r="17" fill="#bb562c" stroke="none" stroke-width="1"/><text x="833" y="175" font-size="18" font-weight="700" fill="#fffdf8" text-anchor="middle">3</text><text x="861" y="176" font-size="19" font-weight="700" fill="#bb562c" text-anchor="start">REPETIÇÃO</text><text x="820" y="207" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Palavras e frases com dificuldade</text><text x="820" y="231" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">crescente; registre os erros.</text><rect x="40" y="268" width="1120" height="431" rx="14" fill="#fffdf8" stroke="#d4ded4"/><rect x="40" y="268" width="1120" height="49" rx="12" fill="#183132" stroke="#183132"/><text x="60" y="299" font-size="16" font-weight="700" fill="#fffdf8" text-anchor="start">SÍNDROME CLÁSSICA</text><text x="455" y="299" font-size="16" font-weight="700" fill="#fffdf8" text-anchor="start">FLUÊNCIA</text><text x="685" y="299" font-size="16" font-weight="700" fill="#fffdf8" text-anchor="start">COMPREENSÃO</text><text x="960" y="299" font-size="16" font-weight="700" fill="#fffdf8" text-anchor="start">REPETIÇÃO</text><rect x="41" y="317" width="1118" height="47" rx="0" fill="#f0f2eb" stroke="none"/><text x="60" y="347" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Broca</text><rect x="439" y="325" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="538" y="347" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Não fluente</text><rect x="671" y="325" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="770" y="347" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><rect x="946" y="325" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="1045" y="347" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><text x="60" y="394" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Wernicke</text><rect x="439" y="372" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="538" y="394" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Fluente</text><rect x="671" y="372" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="770" y="394" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><rect x="946" y="372" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="1045" y="394" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><rect x="41" y="411" width="1118" height="47" rx="0" fill="#f0f2eb" stroke="none"/><text x="60" y="441" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Condução</text><rect x="439" y="419" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="538" y="441" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Fluente</text><rect x="671" y="419" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="770" y="441" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><rect x="946" y="419" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="1045" y="441" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><text x="60" y="488" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Global</text><rect x="439" y="466" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="538" y="488" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Não fluente</text><rect x="671" y="466" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="770" y="488" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><rect x="946" y="466" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="1045" y="488" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><rect x="41" y="505" width="1118" height="47" rx="0" fill="#f0f2eb" stroke="none"/><text x="60" y="535" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Transcortical motora</text><rect x="439" y="513" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="538" y="535" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Não fluente</text><rect x="671" y="513" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="770" y="535" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><rect x="946" y="513" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="1045" y="535" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><text x="60" y="582" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Transcortical sensorial</text><rect x="439" y="560" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="538" y="582" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Fluente</text><rect x="671" y="560" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="770" y="582" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><rect x="946" y="560" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="1045" y="582" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><rect x="41" y="599" width="1118" height="47" rx="0" fill="#f0f2eb" stroke="none"/><text x="60" y="629" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Transcortical mista</text><rect x="439" y="607" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="538" y="629" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Não fluente</text><rect x="671" y="607" width="198" height="32" rx="7" fill="#fae3d5" stroke="none"/><text x="770" y="629" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Comprometida</text><rect x="946" y="607" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="1045" y="629" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><text x="60" y="676" font-size="20" font-weight="700" fill="#183132" text-anchor="start">Anômica*</text><rect x="439" y="654" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="538" y="676" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Fluente</text><rect x="671" y="654" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="770" y="676" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><rect x="946" y="654" width="198" height="32" rx="7" fill="#dcebea" stroke="none"/><text x="1045" y="676" font-size="17" font-weight="600" fill="#183132" text-anchor="middle">Rel. preservada</text><text x="42" y="727" font-size="17" font-weight="700" fill="#183132" text-anchor="start">* Anômica: dificuldade de nomeação. “Rel. preservada” não significa desempenho normal em tarefas complexas.</text><text x="42" y="756" font-size="15" font-weight="400" fill="#49625f" text-anchor="start">Protótipos para organizar achados: há sobreposição e mudança com o tempo. A matriz não determina sozinha a lesão.</text><text x="42" y="781" font-size="15" font-weight="400" fill="#49625f" text-anchor="start">Fontes: ASHA Practice Portal; Merck Manual — Types of Aphasia; Alabama A&amp;M — Classification of Aphasia.</text></svg>