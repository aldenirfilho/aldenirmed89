<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto" lang="pt-BR">
<title id="title">Fraqueza: em qual etapa está a lesão?</title><desc id="desc">Diagrama conceitual da cadeia córtex, neurônio motor inferior, junção neuromuscular e músculo. Lesões de neurônio motor superior tendem a hiperreflexia, espasticidade e sinal plantar extensor, mas na fase aguda pode haver flacidez. Lesões de neurônio motor inferior tendem a hiporreflexia, hipotonia, atrofia e possíveis fasciculações. Junção neuromuscular sugere fraqueza flutuante e fatigabilidade, com reflexos variáveis conforme doença. Miopatias geralmente causam fraqueza proximal e sensibilidade preservada. São padrões de localização, não critérios diagnósticos.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}</style>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#176f70"/></marker>
<marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#bb562c"/></marker>
<marker id="arrow-lav" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#755994"/></marker></defs>
<rect width="1200" height="820" fill="#f5f1e8"/><text x="40" y="40" font-size="15" font-weight="700" fill="#176f70" text-anchor="start">TURBO TEMI 360 X  /  ATLAS 02</text><text x="40" y="83" font-size="35" font-weight="700" fill="#183132" text-anchor="start">Fraqueza: em qual etapa está a lesão?</text><text x="40" y="114" font-size="19" font-weight="400" fill="#49625f" text-anchor="start">Combine distribuição, tônus, reflexos, trofismo e evolução. Um sinal isolado não fecha a topografia.</text><path d="M222.5 215 H401.5" fill="none" stroke="#49625f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M507.5 215 H686.5" fill="none" stroke="#49625f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M792.5 215 H971.5" fill="none" stroke="#49625f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="172.5" cy="215" r="47" fill="#fffdf8" stroke="#176f70" stroke-width="3"/><path d="M149.5 210 C138.5 184 164.5 179 172.5 192 C195.5 171 210.5 199 196.5 212 C207.5 232 182.5 244 172.5 230 C149.5 246 136.5 226 149.5 210" fill="none" stroke="#176f70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M172.5 192 V230 M153.5 203 L164.5 211 M189.5 211 L180.5 220" fill="none" stroke="#176f70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="172.5" y="287" font-size="14" font-weight="700" fill="#176f70" text-anchor="middle">CÓRTEX / VIA LONGA</text><circle cx="457.5" cy="215" r="47" fill="#fffdf8" stroke="#bb562c" stroke-width="3"/><circle cx="445.5" cy="213" r="11" fill="#bb562c" stroke="none" stroke-width="1"/><path d="M436.5 206 L425.5 193 M434.5 216 L422.5 225 M446.5 201 V190 M457.5 214 H479.5 L488.5 199 M479.5 214 L488.5 229" fill="none" stroke="#bb562c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="457.5" y="287" font-size="14" font-weight="700" fill="#bb562c" text-anchor="middle">CÉLULA / AXÔNIO</text><circle cx="742.5" cy="215" r="47" fill="#fffdf8" stroke="#755994" stroke-width="3"/><path d="M719.5 190 V207 Q719.5 218 730.5 218 H754.5 Q765.5 218 765.5 207 V190" fill="none" stroke="#755994" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="730.5" cy="211" r="3" fill="#755994" stroke="none" stroke-width="1"/><path d="M727.5 234 V228 H733.5 V234" fill="none" stroke="#755994" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="742.5" cy="211" r="3" fill="#755994" stroke="none" stroke-width="1"/><path d="M739.5 234 V228 H745.5 V234" fill="none" stroke="#755994" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="754.5" cy="211" r="3" fill="#755994" stroke="none" stroke-width="1"/><path d="M751.5 234 V228 H757.5 V234" fill="none" stroke="#755994" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M715.5 237 H769.5" fill="none" stroke="#755994" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="742.5" y="287" font-size="14" font-weight="700" fill="#755994" text-anchor="middle">TRANSMISSÃO</text><circle cx="1027.5" cy="215" r="47" fill="#fffdf8" stroke="#176f70" stroke-width="3"/><path d="M998.5 201 Q1027.5 184 1056.5 201" fill="none" stroke="#176f70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M998.5 215 Q1027.5 198 1056.5 215" fill="none" stroke="#176f70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M998.5 229 Q1027.5 212 1056.5 229" fill="none" stroke="#176f70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1015.5 199 V231" fill="none" stroke="#176f70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M1027.5 199 V231" fill="none" stroke="#176f70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M1039.5 199 V231" fill="none" stroke="#176f70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1027.5" y="287" font-size="14" font-weight="700" fill="#176f70" text-anchor="middle">FIBRA MUSCULAR</text><rect x="40" y="312" width="265" height="371" rx="18" fill="#fffdf8" stroke="#d4ded4"/><rect x="40" y="312" width="265" height="8" rx="4" fill="#176f70" stroke="#176f70"/><text x="58" y="356" font-size="26" font-weight="700" fill="#176f70" text-anchor="start">NMS • UMN</text><text x="58" y="383" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Neurônio motor superior</text><circle cx="62" cy="420" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="73" y="426" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Padrão piramidal</text><circle cx="62" cy="455" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="73" y="461" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Reflexos vivos</text><circle cx="62" cy="490" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="73" y="496" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Tônus espástico</text><circle cx="62" cy="525" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="73" y="531" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Plantar extensor</text><rect x="54" y="558" width="237" height="107" rx="10" fill="#eeeae1" stroke="none"/><text x="66" y="587" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Atenção à fase aguda:</text><text x="66" y="613" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">pode haver flacidez</text><text x="66" y="639" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">e reflexos reduzidos.</text><rect x="325" y="312" width="265" height="371" rx="18" fill="#fffdf8" stroke="#d4ded4"/><rect x="325" y="312" width="265" height="8" rx="4" fill="#bb562c" stroke="#bb562c"/><text x="343" y="356" font-size="26" font-weight="700" fill="#bb562c" text-anchor="start">NMI • LMN</text><text x="343" y="383" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Neurônio motor inferior</text><circle cx="347" cy="420" r="3" fill="#bb562c" stroke="none" stroke-width="1"/><text x="358" y="426" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Padrão segmentar / nervo</text><circle cx="347" cy="455" r="3" fill="#bb562c" stroke="none" stroke-width="1"/><text x="358" y="461" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Reflexos reduzidos</text><circle cx="347" cy="490" r="3" fill="#bb562c" stroke="none" stroke-width="1"/><text x="358" y="496" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Tônus reduzido</text><circle cx="347" cy="525" r="3" fill="#bb562c" stroke="none" stroke-width="1"/><text x="358" y="531" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Atrofia ± fasciculações</text><rect x="339" y="558" width="237" height="107" rx="10" fill="#eeeae1" stroke="none"/><text x="351" y="587" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Sensibilidade depende</text><text x="351" y="613" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">do local: neurônio motor,</text><text x="351" y="639" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">raiz, plexo ou nervo.</text><rect x="610" y="312" width="265" height="371" rx="18" fill="#fffdf8" stroke="#d4ded4"/><rect x="610" y="312" width="265" height="8" rx="4" fill="#755994" stroke="#755994"/><text x="628" y="356" font-size="26" font-weight="700" fill="#755994" text-anchor="start">JNM</text><text x="628" y="383" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Junção neuromuscular</text><circle cx="632" cy="420" r="3" fill="#755994" stroke="none" stroke-width="1"/><text x="643" y="426" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Flutuação / fatigabilidade</text><circle cx="632" cy="455" r="3" fill="#755994" stroke="none" stroke-width="1"/><text x="643" y="461" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Sinais oculares ou bulbares</text><circle cx="632" cy="490" r="3" fill="#755994" stroke="none" stroke-width="1"/><text x="643" y="496" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Sensibilidade preservada</text><circle cx="632" cy="525" r="3" fill="#755994" stroke="none" stroke-width="1"/><text x="643" y="531" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Reflexos: variáveis</text><rect x="624" y="558" width="237" height="107" rx="10" fill="#eeeae1" stroke="none"/><text x="636" y="587" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Miastenia: usualmente</text><text x="636" y="613" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">preservados; Lambert–</text><text x="636" y="639" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Eaton: podem diminuir.</text><rect x="895" y="312" width="265" height="371" rx="18" fill="#fffdf8" stroke="#d4ded4"/><rect x="895" y="312" width="265" height="8" rx="4" fill="#176f70" stroke="#176f70"/><text x="913" y="356" font-size="26" font-weight="700" fill="#176f70" text-anchor="start">MÚSCULO</text><text x="913" y="383" font-size="17" font-weight="400" fill="#49625f" text-anchor="start">Padrão miopático</text><circle cx="917" cy="420" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="928" y="426" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Fraqueza proximal comum</text><circle cx="917" cy="455" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="928" y="461" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Sensibilidade preservada</text><circle cx="917" cy="490" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="928" y="496" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Reflexos podem persistir</text><circle cx="917" cy="525" r="3" fill="#176f70" stroke="none" stroke-width="1"/><text x="928" y="531" font-size="17" font-weight="400" fill="#183132" text-anchor="start">Tônus normal ou reduzido</text><rect x="909" y="558" width="237" height="107" rx="10" fill="#eeeae1" stroke="none"/><text x="921" y="587" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">Há miopatias distais</text><text x="921" y="613" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">ou assimétricas; o padrão</text><text x="921" y="639" font-size="16" font-weight="400" fill="#49625f" text-anchor="start">clássico tem exceções.</text><rect x="40" y="703" width="1120" height="56" rx="13" fill="#e5ebe1" stroke="none"/><text x="61" y="737" font-size="18" font-weight="700" fill="#183132" text-anchor="start">LEITURA CLÍNICA: localize pelo conjunto e reexamine. Padrões mistos e apresentações incompletas são possíveis.</text><text x="40" y="788" font-size="14" font-weight="400" fill="#49625f" text-anchor="start">Esquema conceitual, sem dados de paciente. NMS/NMI correspondem a UMN/LMN na literatura em inglês.</text><text x="40" y="808" font-size="14" font-weight="400" fill="#49625f" text-anchor="start">Fonte: Merck Manual Professional — Weakness. Consulte o contexto e o exame completo.</text></svg>