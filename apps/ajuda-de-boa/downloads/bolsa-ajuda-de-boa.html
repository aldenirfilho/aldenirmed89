function evalFields(ev,kind){const x=ev||{necessidade:2,gratidao:2,oportunidade:2,criatividade:1,seguranca:2,reserva:true,recebidoCents:null};
 return `<fieldset class="xp-eval"><legend>⭐ XP da Boa Ação</legend>${X.CRITERIA.map(c=>`<div class="crit"><span class="crit-label">${c.icon} <b>${c.label}</b><small>${e(c.hint)}</small></span><span class="seg">${[0,1,2,3].map(v=>`<label title="${e(c.scale[v])}"><input type="radio" name="${c.id}" value="${v}" ${x[c.id]===v?'checked':''}><span>${v}</span></label>`).join('')}</span><small class="crit-scale" data-scale="${c.id}">${e(c.scale[x[c.id]])}</small></div>`).join('')}<div class="crit"><span class="crit-label">🏦 <b>Reserva preservada?</b><small>Seu sustento continua protegido?</small></span><span class="seg"><label><input type="radio" name="reserva" value="sim" ${x.reserva?'checked':''}><span>Sim</span></label><label><input type="radio" name="reserva" value="nao" ${x.reserva?'':'checked'}><span>Não</span></label></span><small class="crit-scale">Quem se prejudica não pontua.</small></div><label class="field xp-received" ${kind&&kind!=='dinheiro'?'hidden':''}>Recebido no período (R$, opcional)<input name="recebido" inputmode="decimal" maxlength="16" value="${x.recebidoCents?moneyInput(x.recebidoCents):''}" placeholder="opcional · medida ideal 5%"></label><output class="xp-preview"></output></fieldset>`;}
function readEval(form){const d=new FormData(form),x={};for(const c of X.CRITERIA){const v=Number(d.get(c.id));if(!Number.isInteger(v)||v<0||v>3)throw Error('Avalie todos os critérios (0 a 3).');x[c.id]=v;}x.reserva=d.get('reserva')!=='nao';const k=form.querySelector('[name=kind]')?.value||form.dataset.kind||'dinheiro';x.recebidoCents=k==='dinheiro'?bigCents(d.get('recebido')):null;return x;}
function previewXp(form){const out=form.querySelector('.xp-preview');if(!out)return;try{const x=readEval(form);const k=form.querySelector('[name=kind]')?.value||form.dataset.kind||'dinheiro';let amount=Number(form.dataset.amount||0);const am=form.querySelector('[name=amount]');if(am&&k==='dinheiro')try{amount=C.cents(am.value);}catch{amount=0;}const s=X.score({kind:k,amountCents:amount,xp:x});for(const el of form.querySelectorAll('[data-scale]')){const c=X.CRITERIA.find(q=>q.id===el.dataset.scale);el.textContent=c.scale[x[c.id]];}out.innerHTML=s.lock?'<b>XP previsto: 0</b> · trava ativa':`<b>XP previsto: ${X.fmt(s.xp)}</b> · qualidade ${s.quality.toFixed(2).replace('.',',')} · medida ${s.measure.toFixed(2).replace('.',',')}${s.proportion!==null?' · '+(s.proportion*100).toFixed(1).replace('.',',')+'% do recebido':''}`;}catch(err){out.textContent=err.message;}}

/* ---------- telas ---------- */
function renderLock(hasVault,error){$('#app').innerHTML=`<section class="lock"><div class="crest" aria-hidden="true">⚜️</div><h1>Bolsa Ajuda de Boa</h1><p class="lead">Seu home broker do bem: cada ajuda vira uma posição, cada gesto vira XP de honra.</p>${error?`<div class="alert">${e(error)}</div>`:''}${sessionMode?'<div class="alert">⚠️ Modo sessão: este navegador não permite guardar dados neste arquivo. O cofre fica só na memória — <b>exporte o backup antes de fechar</b>, ou abra o arquivo no Chrome, Edge ou Firefox do computador.</div>':''}<form id="${hasVault?'unlock-form':'create-form'}" class="card stack"><h2>${hasVault?'🔐 Abrir meu cofre':'🛡️ Criar meu cofre'}</h2><label class="field">Senha do cofre<input type="password" name="password" minlength="12" maxlength="256" autocomplete="${hasVault?'current-password':'new-password'}" placeholder="Uma frase longa que só você conhece" required></label>${hasVault?'':`<label class="field">Repita a senha<input type="password" name="confirmation" minlength="12" maxlength="256" autocomplete="new-password" required></label><label class="check"><input type="checkbox" required><span>Entendi: a senha não pode ser recuperada e preciso exportar backups.</span></label>`}<div class="form-error" hidden></div><button class="btn gold" type="submit">${hasVault?'Abrir cofre':'Criar cofre'}</button><button class="btn ghost" type="button" data-action="import">📥 Importar backup (site ou app)</button>${hasVault?'<button class="btn ghost danger" type="button" data-action="erase">Apagar cofre deste navegador</button>':''}</form><p class="fine">AES-256-GCM + PBKDF2 (310 mil iterações). Sem conta, sem servidor, sem rastreadores. Não use senha de banco. O app não recebe nem movimenta dinheiro e não confirma pagamentos.</p><p class="fine">🌐 Catálogo, Pix rápido e novidades: <a href="${SITE}" target="_blank" rel="noopener noreferrer">Ajuda de Boa 360X ↗</a></p></section>`;}
function shell(inner){const t=[['painel','📊','Painel'],['registrar','➕','Registrar'],['extrato','📒','Extrato'],['orgs','🏛️','Organizações'],['pix','⚡','Pix rápido'],['xp','⭐','XP'],['cofre','🔐','Cofre']];
 const xs=X.summary(entries(),cause);
 return `<header class="top"><div class="brand"><span class="crest-sm" aria-hidden="true">⚜️</span><div><b>Bolsa Ajuda de Boa</b><small>360X · home broker do bem</small></div></div><div class="top-xp" title="XP da Boa Ação"><span>${xs.level.icon}</span><div><b>${X.fmt(xs.total)} XP</b><small>${e(xs.level.name)}</small></div></div><button class="btn ghost sm" data-action="lock">🔒 Bloquear</button></header>${tape()}${sessionMode?'<div class="alert slim">⚠️ Modo sessão: exporte o backup antes de fechar.</div>':''}<nav class="tabs" aria-label="Seções">${t.map(([id,i,l])=>`<a href="#${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${l}</a>`).join('')}</nav><main id="main" tabindex="-1">${inner}</main><footer class="foot">Bolsa Ajuda de Boa 1.0 · Projeto 360X de Aldenir Rocha de Oliveira Filho · Equipe 360X · registros autodeclarados, não bancários · <a href="${SITE}" target="_blank" rel="noopener noreferrer">Ajuda de Boa ↗</a> · <a href="https://aldenirfilho.github.io/aldenirmed89/" target="_blank" rel="noopener noreferrer">AldenirMed 360X ↗</a> · <a href="https://aldenirfilho.github.io/intensivahub/flashcards/" target="_blank" rel="noopener noreferrer">Códice 360X ↗</a></footer>`;}
function positions(list){const m=new Map();for(const r of list){const p=m.get(r.causeId)||{id:r.causeId,n:0,cents:0,xp:0,last:''};p.n++;if(r.kind==='dinheiro')p.cents+=r.amountCents;const s=X.score(r);p.xp+=s.xp;if(r.date>p.last)p.last=r.date;m.set(r.causeId,p);}return [...m.values()].sort((a,b)=>b.xp-a.xp||b.cents-a.cents);}
function tape(){const pos=positions(entries());const items=(pos.length?pos.map(p=>{const c=cause(p.id);return `<span><b>${e(c.ticker)}</b> ${X.fmt(p.xp)} XP ▲ ${p.n}</span>`;}):DATA.map(c=>`<span><b>${e(c.ticker)}</b> ${pixReady(c)?'Pix ✓':c.pix?'Pix 🔄':'canal'}</span>`));return `<div class="tape" aria-hidden="true"><div class="tape-track">${items.join('')}${items.join('')}</div></div>`;}
function monthChart(list){const now=new Date();const months=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);}const vals=months.map(m=>list.filter(r=>r.date.startsWith(m)).reduce((a,r)=>a+X.score(r).xp,0));const max=Math.max(1,...vals);const w=24,g=8,h=110;
 return `<svg class="chart" viewBox="0 0 ${months.length*(w+g)} ${h+26}" role="img" aria-label="XP por mês nos últimos 12 meses">${vals.map((v,i)=>{const bh=Math.round((v/max)*h);return `<rect x="${i*(w+g)}" y="${h-bh}" width="${w}" height="${Math.max(bh,2)}" rx="4" class="${v?'bar-on':'bar-off'}"><title>${months[i].slice(5)}/${months[i].slice(0,4)}: ${X.fmt(v)} XP</title></rect><text x="${i*(w+g)+w/2}" y="${h+16}" text-anchor="middle">${months[i].slice(5)}</text>`;}).join('')}</svg>`;}
function viewPainel(){const list=entries(),xs=X.summary(list,cause),money=list.filter(r=>r.kind==='dinheiro'),total=money.reduce((a,r)=>a+r.amountCents,0),pos=positions(list),totXp=pos.reduce((a,p)=>a+p.xp,0)||1;
 return `<section class="hero-xp"><div class="lvl"><span class="lvl-icon">${xs.level.icon}</span><div><small>NÍVEL ATUAL</small><h1>${e(xs.level.name)}</h1><div class="bar"><span style="width:${(xs.level.progress*100).toFixed(1)}%"></span></div><small>${X.fmt(xs.level.toNext)} XP para ${e(xs.level.next)} · o XP tende ao infinito</small></div></div><div class="kpis"><div><small>XP total</small><b>${X.fmt(xs.total)}</b></div><div><small>Ajudas</small><b>${list.length}</b></div><div><small>Doações informadas</small><b>${C.cash(total)}</b></div><div><small>Instituições</small><b>${pos.length}</b></div><div><small>Comprovantes</small><b>${list.filter(r=>r.evidence).length}</b></div><div><small>Pendentes de XP</small><b>${xs.pending}</b></div></div></section>
 <section class="grid2"><article class="card"><h2>📈 Carteira de impacto · posições</h2>${pos.length?`<table class="pos"><thead><tr><th>Ticker</th><th>Instituição</th><th>Ajudas</th><th>R$ informado</th><th>XP</th><th>Peso</th></tr></thead><tbody>${pos.map(p=>{const c=cause(p.id);return `<tr><td><b class="tk">${e(c.ticker)}</b></td><td>${c.icon} ${e(c.name)}</td><td>${p.n}</td><td>${p.cents?C.cash(p.cents):'—'}</td><td>${X.fmt(p.xp)}</td><td><div class="mini"><span style="width:${(p.xp/totXp*100).toFixed(1)}%"></span></div></td></tr>`;}).join('')}</tbody></table>`:`<div class="empty"><p>Nenhuma posição ainda. Registre sua primeira ajuda para abrir a carteira.</p><a class="btn gold" href="#registrar">➕ Registrar ajuda</a></div>`}<p class="fine">Peso = participação no seu XP. Valores autodeclarados, sem confirmação bancária.</p></article><article class="card"><h2>⭐ XP por mês</h2>${monthChart(list)}<h3>🏅 Conquistas</h3><div class="badges">${xs.badges.map(b=>`<span class="badge ${b.ok?'on':''}" title="${e(b.hint)}">${b.icon} ${e(b.name)}</span>`).join('')}</div></article></section>`;}
function viewRegistrar(pre={}){const c=cause(pre.id||'');const kind=pre.kind||(c&&!c.methods.includes('dinheiro')&&c.methods.includes('sangue')?'sangue':'dinheiro');
 return `<section class="card narrow"><h2>➕ Registrar uma ajuda já realizada</h2><p class="fine">O registro é autodeclarado: não executa nem comprova pagamento. Comprovantes ficam só no seu cofre.</p><form id="record-form" class="stack"><label class="field">Instituição<select name="causeId" required><option value="">Selecione</option>${DATA.map(x=>`<option value="${x.id}" ${x.id===pre.id?'selected':''}>${e(x.ticker)} · ${e(x.name)}</option>`).join('')}</select></label><div class="row2"><label class="field">Data<input type="date" name="date" value="${today()}" max="${today()}" min="1900-01-01" required></label><label class="field">Tipo<select name="kind">${Object.entries(kindLabel).map(([k,l])=>`<option value="${k}" ${k===kind?'selected':''}>${l}</option>`).join('')}</select></label></div><label class="field amount-field" ${kind==='dinheiro'?'':'hidden'}>Valor (R$)<input name="amount" inputmode="decimal" maxlength="12" value="${moneyInput(pre.amount||2500)}"></label><label class="field">Descrição breve (obrigatória para materiais, tempo e divulgação)<textarea name="detail" maxlength="240" rows="2" placeholder="Sem nomes de beneficiários, CPF ou dados de saúde"></textarea></label><label class="field">Comprovante (opcional: PDF, PNG, JPG ou WebP até 3 MB)<input type="file" name="evidence" accept="application/pdf,image/png,image/jpeg,image/webp"></label>${evalFields(null,kind)}<label class="check"><input type="checkbox" required><span>Entendi que é autodeclarado e não é recibo bancário ou fiscal.</span></label><div class="form-error" hidden></div><button class="btn gold" type="submit">Salvar no cofre e somar XP</button></form></section>`;}
function recordRow(r){const c=cause(r.causeId),s=X.score(r);return `<article class="rec"><div class="rec-main"><b class="tk">${e(c.ticker)}</b><div><h3>${c.icon} ${e(c.name)}</h3><p>${day(r.date)} · ${kindLabel[r.kind]}${r.detail?' · '+e(r.detail):''}</p></div></div><div class="rec-val">${r.kind==='dinheiro'?C.cash(r.amountCents):'—'}<span class="xp-chip ${s.evaluated?(s.lock?'lock':''):'pending'}">${s.evaluated?(s.lock?'🔒 0 XP':'⭐ +'+X.fmt(s.xp)):'⏳ avaliar'}</span></div><div class="rec-act"><button class="btn ghost sm" data-action="evaluate" data-id="${r.id}">${s.evaluated?'Revisar XP':'Avaliar XP'}</button>${r.evidence?`<button class="btn ghost sm" data-action="evidence" data-id="${r.id}">Comprovante</button>`:''}<button class="btn ghost sm danger" data-action="delete" data-id="${r.id}">Excluir</button></div></article>`;}
function viewExtrato(){const list=entries();return `<section class="card"><div class="row-between"><h2>📒 Extrato</h2><a class="btn gold sm" href="#registrar">➕ Registrar</a></div>${list.length?list.map(recordRow).join(''):'<p class="empty">Sem lançamentos. O extrato começa vazio: nenhum pagamento foi simulado.</p>'}</section>`;}
function viewOrgs(){return `<section class="orgs">${DATA.map(c=>`<article class="card org"><div class="org-head"><span class="org-icon">${c.icon}</span><div><b class="tk">${e(c.ticker)}</b><h3>${e(c.name)}</h3><small>${e(c.region)} · ${catLabel[c.category]||''}</small></div></div><p><b>🔭 Perspectiva:</b> ${e(c.perspective)}</p><ul>${c.projects.map(p=>`<li><b>${e(p.t)}</b> — ${e(p.d)}</li>`).join('')}</ul><p class="fine">Projetos: ${ext(c.projSource.url,c.projSource.label)} (${e(c.projSource.type)}, ${day(c.projSource.checked)}). Fonte de doação: ${day(c.checked)}. Não é auditoria.</p><div class="row-wrap">${c.pix?`<button class="btn gold sm" data-action="pix-org" data-id="${c.id}">⚡ Pix ${pixReady(c)?'pronto':'· conferir chave'}</button>`:''}${ext(c.helpUrl,'Canal oficial','btn ghost sm')}<button class="btn ghost sm" data-action="record-org" data-id="${c.id}">➕ Registrar ajuda</button></div></article>`).join('')}</section>`;}
function viewPix(){const list=DATA.filter(c=>c.pix);const c=cause(quick.id)||list.find(pixReady)||list[0];quick.id=c.id;let panel;
 if(pixReady(c)){const payload=C.pix(c.pix,quick.amount);panel=`<div class="pix"><div class="qr">${C.qrSvg(payload)}</div><div><div class="pix-amount">${C.cash(quick.amount)}</div><p><b>${e(c.name)}</b><br><small>${e(c.pix.legalName)} · CNPJ ${e(c.pix.cnpj)}</small></p><label class="field">Pix Copia e Cola<textarea id="pix-payload" readonly spellcheck="false">${e(payload)}</textarea></label><div class="row-wrap"><button class="btn gold" data-action="copy">📋 Copiar</button><button class="btn ghost" data-action="qr-svg">⬇️ QR (SVG)</button><button class="btn ghost" data-action="record-org" data-id="${c.id}" data-value="${quick.amount}">✅ Já doei · registrar</button></div><p class="fine">${fresh(c)?'Chave conferida na fonte oficial em '+day(c.checked):'Chave conferida por você no site oficial'}. Confira o recebedor no banco. Pague uma vez só. Gerar o código não é doar.</p></div></div>`;}
 else panel=`<div class="check-box"><h3>🛡️ Conferência anti-golpe</h3><p>Chave consultada em ${day(c.checked)}. Abra a página oficial e confira se a chave é exatamente:</p><p class="key"><b>${e(c.pix.key)}</b><br><small>${e(c.pix.legalName)} · CNPJ ${e(c.pix.cnpj)}</small></p><p>${ext(c.source,'Abrir página oficial de doação','btn ghost')}</p><label class="check"><input type="checkbox" id="pix-confirm"><span>Conferi no site oficial: a chave é a mesma. Se o banco mostrar outro recebedor, não pago.</span></label><button class="btn gold" data-action="pix-check" data-id="${c.id}">Liberar Pix por 30 dias</button></div>`;
 return `<section class="card"><h2>⚡ Pix rápido · direto à instituição</h2><p class="fine">1. Escolha a causa · 2. o valor · 3. leia o QR no app do banco. Nada passa por este app.</p><div class="pix-orgs">${list.map(x=>`<button class="pix-org ${x.id===c.id?'active':''}" data-action="pix-org" data-id="${x.id}" aria-pressed="${x.id===c.id}">${x.icon} <b>${e(x.ticker)}</b><small>${e(x.name)}</small><i>${pixReady(x)?'✓ pronto':'🔄 conferir'}</i></button>`).join('')}</div><div class="amounts">${[1000,2000,5000,10000].map(v=>`<button class="chip ${v===quick.amount?'active':''}" data-action="pix-amount" data-value="${v}">${C.cash(v)}</button>`).join('')}<label class="other">Outro <input id="pix-value" inputmode="decimal" maxlength="12" value="${moneyInput(quick.amount)}"></label></div>${panel}</section>`;}
function viewXp(){const xs=X.summary(entries(),cause);return `<section class="grid2"><article class="card"><h2>⭐ XP da Boa Ação</h2><p>Honra e mérito, não dinheiro. Cada ajuda vale de <b>1.000 a 10.000 XP</b> pela qualidade do gesto; o valor só entra pela <b>medida</b> (doado ÷ recebido, ideal 5%). Doar além da medida não rende mais XP.</p><table class="pos"><tbody>${X.CRITERIA.map(c=>`<tr><td>${c.icon} ${c.label}</td><td>peso ${X.PARAMS.weights[c.id]}</td><td class="fine">${e(c.scale.join(' · '))}</td></tr>`).join('')}</tbody></table><p class="fine">Travas: reserva comprometida ou destinatário não verificado = 0 XP. Mesma régua do Placar XP da planilha: exporte o CSV e cole na aba “Ajudas”.</p><h3>🏰 Níveis</h3><div class="levels">${X.LEVELS.map(l=>`<span class="${xs.total>=l.min?'on':''}">${l.icon} ${e(l.name)} <small>${X.fmt(l.min)}</small></span>`).join('')}<span>∞ estrelas a cada 2,5 mi</span></div><button class="btn gold" data-action="placar">⬇️ Placar XP (CSV da planilha)</button></article><article class="card"><h2>🧮 Simulador</h2><form id="calc-form" class="stack"><div class="row2"><label class="field">Tipo<select name="kind">${Object.entries(kindLabel).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><label class="field">Valor (R$)<input name="amount" inputmode="decimal" value="50,00"></label></div>${evalFields(null,'dinheiro')}</form><h3>🏅 Conquistas</h3><div class="badges">${xs.badges.map(b=>`<span class="badge ${b.ok?'on':''}" title="${e(b.hint)}">${b.icon} ${e(b.name)} <small>${e(b.hint)}</small></span>`).join('')}</div></article></section>`;}
function viewCofre(){return `<section class="grid2"><article class="card"><h2>🔐 Cofre e backups</h2><div class="stack"><button class="btn gold" data-action="backup">⬇️ Exportar backup criptografado</button><button class="btn ghost" data-action="csv">⬇️ Exportar CSV do histórico</button><button class="btn ghost" data-action="placar">⬇️ Exportar Placar XP (CSV)</button><button class="btn ghost" data-action="lock">🔒 Bloquear agora</button></div><p class="fine">O backup é o mesmo formato do site Ajuda de Boa (BA360-VAULT, AES-256-GCM): exporte aqui e importe lá, ou o inverso. Para importar outro backup, bloqueie o cofre e use “Importar backup” na tela inicial.</p></article><article class="card"><h2>🛡️ Boas práticas anti-golpe</h2><ul class="tips"><li>Ninguém da Ajuda de Boa pede senha, código ou Pix por mensagem.</li><li>Confira sempre o nome do recebedor no app do banco antes de autorizar.</li><li>Chaves Pix só valem se coincidirem com a página oficial da instituição.</li><li>Desconfie de urgência, pressão ou “última chance”.</li><li>Guarde o comprovante: ele sobe a Segurança do seu XP.</li></ul><p class="fine">Bloqueio automático após 5 minutos sem uso.</p></article></section>`;}
function render(){if(!V||V.locked)return;const map={painel:viewPainel,registrar:viewRegistrar,extrato:viewExtrato,orgs:viewOrgs,pix:viewPix,xp:viewXp,cofre:viewCofre};$('#app').innerHTML=shell((map[tab]||viewPainel)());for(const f of document.querySelectorAll('#app form'))previewXp(f);}
async function showLock(error){let has=false;try{has=await V.exists();}catch(err){error=error||err.message;}renderLock(has,error);}
function route(){const h=location.hash.slice(1);tab=['painel','registrar','extrato','orgs','pix','xp','cofre'].includes(h)?h:'painel';if(V&&!V.locked){render();window.scrollTo({top:0});}}
function entry(id){return V.data?.entries.find(r=>r.id===id);}
async function attachment(file){if(!file||!file.size)return null;if(file.size>V.MAX_FILE)throw Error('O anexo deve ter no máximo 3 MB.');const bytes=new Uint8Array(await file.arrayBuffer()),type=V.signature(bytes);if(!type)throw Error('Use PDF, PNG, JPG ou WebP válido.');const digest=await crypto.subtle.digest('SHA-256',bytes),hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');if(V.data.entries.some(r=>r.evidence?.sha256===hash))throw Error('Este arquivo já está anexado a outro registro.');return{type,bytes:bytes.length,data:C.b64(bytes),sha256:hash};}
function lock(){if(!V||V.locked)return;V.lock();closeDialog();showLock();toast('Cofre bloqueado.');}

/* ---------- ações ---------- */
async function act(name,b){const id=b.dataset.id;switch(name){
 case'import':if(!V.locked)throw Error('Bloqueie o cofre antes de importar.');$('#import-file').value='';$('#import-file').click();break;
 case'erase':{const a=prompt('Isto apaga o cofre deste navegador (backups externos continuam). Digite APAGAR:');if(a!=='APAGAR')return;await V.erase();await showLock();toast('Cofre apagado deste navegador.');}break;
 case'lock':lock();break;
 case'close':closeDialog();break;
 case'pix-org':quick.id=id;tab='pix';if(location.hash!=='#pix')location.hash='pix';else render();break;
 case'pix-amount':quick.amount=Number(b.dataset.value);render();break;
 case'pix-check':{const c=cause(id);if(!$('#pix-confirm')?.checked)throw Error('Marque a confirmação depois de conferir a chave no site oficial.');saveCheck(c);render();toast('Conferência registrada por 30 dias. Confira também o recebedor no banco.');}break;
 case'copy':{const t=$('#pix-payload');try{await navigator.clipboard.writeText(t.value);toast('Código copiado. Confira o recebedor no banco.');}catch{t.select();document.execCommand('copy');toast('Código selecionado/copiado.');}}break;
 case'qr-svg':{const c=cause(quick.id);if(!pixReady(c))throw Error('Confira a chave primeiro.');download(C.qrSvg(C.pix(c.pix,quick.amount)),'image/svg+xml',`pix-${c.ticker}.svg`);}break;
 case'record-org':tab='registrar';$('#app').innerHTML=shell(viewRegistrar({id,amount:Number(b.dataset.value)||2500}));previewXp($('#record-form'));if(location.hash!=='#registrar')history.replaceState(null,'','#registrar');break;
 case'evaluate':{const r=entry(id),c=cause(r.causeId);openDialog(`<h2>${r.xp?'Revisar':'Avaliar'} XP · <span class="tk">${e(c.ticker)}</span></h2><p>${c.icon} ${e(c.name)} · ${day(r.date)} · ${kindLabel[r.kind]}${r.kind==='dinheiro'?' · '+C.cash(r.amountCents):''}</p><form id="eval-form" class="stack" data-id="${r.id}" data-kind="${r.kind}" data-amount="${r.amountCents}">${evalFields(r.xp||{necessidade:2,gratidao:2,oportunidade:2,criatividade:1,seguranca:X.suggestSecurity(true,!!r.evidence),reserva:true,recebidoCents:null},r.kind)}<div class="form-error" hidden></div><div class="row-wrap"><button class="btn gold" type="submit">Salvar avaliação</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`);previewXp($('#eval-form'));}break;
 case'evidence':{const r=entry(id);if(!confirm('O comprovante será baixado sem criptografia. Continuar?'))return;const ex=({'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[r.evidence.type];download(new Blob([C.unb64(r.evidence.data)],{type:r.evidence.type}),r.evidence.type,`comprovante-${r.id.slice(-6)}.${ex}`);}break;
 case'delete':if(!confirm('Excluir este lançamento do cofre? Isso não estorna nenhuma doação.'))return;await V.mutate(s=>{s.entries=s.entries.filter(r=>r.id!==id);});render();toast('Lançamento excluído.');break;
 case'backup':download(await V.backup(),'application/json',`bolsa360-backup-criptografado-${today()}.json`);toast('Backup criptografado exportado. Guarde a senha separadamente.');break;
 case'csv':{if(!confirm('O CSV sai sem criptografia (sem anexos). Baixar?'))return;const rows=[['id_local','ticker','instituicao','data','tipo','valor_reais','xp_boa_acao','situacao','descricao'],...entries().map(r=>{const c=cause(r.causeId),s=X.score(r);return [r.id,c.ticker,c.name,r.date,r.kind,r.kind==='dinheiro'?(r.amountCents/100).toFixed(2).replace('.',','):'',s.evaluated?s.xp.toFixed(2).replace('.',','):'','AUTODECLARADO_NAO_CONFIRMADO',r.detail];})];download('﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8',`bolsa-ajuda-historico-${today()}.csv`);}break;
 case'placar':{if(!confirm('O Placar XP sai sem criptografia e pode conter valores recebidos. Baixar?'))return;download('﻿'+X.placarRows(entries(),cause).map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8',`placar-xp-boa-acao-${today()}.csv`);toast('Placar exportado: cole na aba “Ajudas” da planilha para somar ao XP vigente.');}break;
}}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;ev.preventDefault();b.disabled=true;try{await act(b.dataset.action,b);}catch(err){fail(err);}finally{if(b.isConnected)b.disabled=false;}});
document.addEventListener('submit',async ev=>{const f=ev.target;ev.preventDefault();if(f.id==='calc-form')return;if(!f.checkValidity()){f.reportValidity();return;}const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;const d=new FormData(f);try{switch(f.id){
 case'create-form':{const p=String(d.get('password'));if(p!==String(d.get('confirmation')))throw Error('As senhas não coincidem.');await V.create(p);lastActivity=Date.now();route();render();toast('Cofre criado. Exporte backups com frequência.');}break;
 case'unlock-form':await V.unlock(String(d.get('password')));lastActivity=Date.now();route();render();toast('Cofre aberto.');break;
 case'import-form':{await V.importBackup(pendingImport,String(d.get('password')),!!d.get('replace'));pendingImport=null;closeDialog();route();render();toast('Backup importado e aberto.');}break;
 case'eval-form':{const x=readEval(f),rid=f.dataset.id;await V.mutate(s=>{const r=s.entries.find(k=>k.id===rid);if(!r)throw Error('Lançamento não encontrado.');r.xp=x;});closeDialog();render();const s=X.score(entry(rid));toast(s.lock?'Avaliação salva: trava ativa, 0 XP.':`+${X.fmt(s.xp)} XP da Boa Ação.`);}break;
 case'record-form':{const cid=String(d.get('causeId')),date=String(d.get('date')),kind=String(d.get('kind')),detail=String(d.get('detail')).trim();if(!cause(cid))throw Error('Escolha uma instituição.');if(!V.validDate(date)||date>today())throw Error('Data inválida ou futura.');if(!X.KINDS.includes(kind))throw Error('Tipo inválido.');if(['materiais','tempo','divulgacao'].includes(kind)&&!detail)throw Error('Descreva os materiais, o tempo ou a divulgação.');const amountCents=kind==='dinheiro'?C.cents(d.get('amount')):0;const xp=readEval(f);if(entries().some(r=>r.causeId===cid&&r.date===date&&r.kind===kind&&r.amountCents===amountCents)&&!confirm('Já existe lançamento igual nesta data. É outra ajuda?'))return;const evidence=await attachment(d.get('evidence'));const r={id:'BA-'+crypto.randomUUID(),causeId:cid,date,kind,amountCents,detail,createdAt:new Date().toISOString(),evidence,xp};await V.mutate(s=>s.entries.unshift(r));lastActivity=Date.now();location.hash='extrato';route();const s=X.score(r);toast(s.lock?'Lançamento salvo. Trava ativa: 0 XP.':`Lançamento salvo: +${X.fmt(s.xp)} XP da Boa Ação.`);}break;
}}catch(err){fail(err);}finally{if(btn?.isConnected)btn.disabled=false;}});
document.addEventListener('change',ev=>{const t=ev.target,f=t.form;if(t.id==='pix-value'){try{quick.amount=C.cents(t.value);render();}catch(err){t.value=moneyInput(quick.amount);fail(err);}return;}
 if(f&&t.name==='kind'){const money=t.value==='dinheiro';const a=f.querySelector('.amount-field');if(a)a.hidden=!money;const r=f.querySelector('.xp-received');if(r)r.hidden=!money;}
 if(f&&t.name==='evidence'){const target=f.querySelector(`input[name=seguranca][value="${X.suggestSecurity(true,!!t.files?.length)}"]`);if(target)target.checked=true;}
 if(f)previewXp(f);});
document.addEventListener('input',ev=>{const f=ev.target.form;if(f&&ev.target.type!=='file')previewXp(f);});
$('#import-file').addEventListener('change',async ev=>{try{const file=ev.target.files?.[0];if(!file)return;if(file.size>25*1024*1024)throw Error('Backup acima de 25 MB.');let env;try{env=JSON.parse(await file.text());V.validateEnvelope(env);}catch{throw Error('Arquivo inválido: escolha um backup BA360 do site Ajuda de Boa ou deste app.');}pendingImport=env;const has=await V.exists();openDialog(`<h2>📥 Importar backup</h2><p>O arquivo é aberto só neste aparelho. Use a senha original.</p><form id="import-form" class="stack"><label class="field">Senha do backup<input type="password" name="password" minlength="12" maxlength="256" required></label>${has?'<label class="check"><input type="checkbox" name="replace" required><span>Substituir o cofre deste navegador por este backup (sem mesclagem).</span></label>':''}<div class="form-error" hidden></div><div class="row-wrap"><button class="btn gold" type="submit">Descriptografar e importar</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`);}catch(err){fail(err);}});
window.addEventListener('hashchange',route);
for(const evn of ['keydown','pointerdown','input'])document.addEventListener(evn,()=>lastActivity=Date.now(),{passive:true});
setInterval(()=>{if(V&&!V.locked&&Date.now()-lastActivity>5*60*1000)lock();},15000);
window.addEventListener('pagehide',()=>{if(V)V.lock();});

/* ---------- partida ---------- */
(async function start(){
 loadChecks();
 const host=location.hostname||'';
 if(/\.github\.io$/i.test(host)){ // endereço compartilhado: não abre cofre aqui, oferece o download
  $('#app').innerHTML=`<section class="lock"><div class="crest" aria-hidden="true">⚜️</div><h1>Bolsa Ajuda de Boa</h1><p class="lead">Este endereço é compartilhado com outros sites; por segurança o cofre não abre aqui.</p><div class="card stack"><a class="btn gold" href="${e(location.href.split('#')[0])}" download="bolsa-ajuda-de-boa.html">⬇️ Baixar o app (arquivo único)</a><p class="fine">Depois de baixar, abra o arquivo no navegador do computador. Ele funciona offline.</p><a class="btn ghost" href="${SITE}">← Voltar à Ajuda de Boa</a></div></section>`;return;}
 if(!(await probeIDB())){Object.defineProperty(window,'indexedDB',{value:memoryIDB(),configurable:true});sessionMode=true;}
 V=window.BA360_VAULT;
 if(!V.supported()){$('#app').innerHTML='<section class="lock"><h1>Bolsa Ajuda de Boa</h1><div class="alert">Este navegador não oferece Web Crypto. Abra o arquivo no Chrome, Edge, Firefox ou Safari atualizados.</div></section>';return;}
 await showLock();
})();
})();
</script>
