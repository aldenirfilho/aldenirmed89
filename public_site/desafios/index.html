<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Desafios Clínicos | Antigravity</title>
<meta name="description" content="Desafios clínicos de Medicina Intensiva (TEMI) e Clínica Médica avançada (R3) — leitura contínua, casos, questões e raciocínio de plantão."/>

  ╔══════════════════════════════════════════════════════════════╗
  ║  ANTIGRAVITY · DESAFIOS CLÍNICOS                              ║
  ║  Página full-page: lista todos os desafios e, com            ║
  ║  ?b=temi&id=<slug>, abre o leitor de rolagem contínua.       ║

<style>
:root{
  --bg:#040d1a;--bg2:#071422;--bg3:#0b1a2e;
  --surf:rgba(255,255,255,.055);--surf-h:rgba(255,255,255,.09);
  --brd:rgba(255,255,255,.09);--brd-h:rgba(255,255,255,.18);
  --text:#e4edf8;--muted:#5c7a9a;--soft:#93b0cc;
  --cyan:#3ee8ff;--cyan-d:rgba(62,232,255,.14);
  --violet:#a98cff;--vio-d:rgba(169,140,255,.14);
  --green:#4ef0a1;--grn-d:rgba(78,240,161,.12);
  --yellow:#ffd166;--yel-d:rgba(255,209,102,.13);
  --red:#ff6060;
  --font-head:'Syne',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --font-body:'Outfit',sans-serif;
  --r:14px;--r-lg:22px;--r-xl:32px;
  --shadow:0 24px 80px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* background */
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:32px 32px;pointer-events:none;z-index:0}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;animation:orbdrift 24s ease-in-out infinite alternate}
.orb:nth-child(1){width:600px;height:600px;top:-180px;left:-140px;background:radial-gradient(circle,rgba(62,232,255,.10) 0%,transparent 70%)}
.orb:nth-child(2){width:500px;height:500px;top:10%;right:-100px;background:radial-gradient(circle,rgba(169,140,255,.10) 0%,transparent 70%);animation-delay:-9s}
.orb:nth-child(3){width:450px;height:450px;bottom:-120px;left:35%;background:radial-gradient(circle,rgba(78,240,161,.07) 0%,transparent 70%);animation-delay:-17s}
@keyframes orbdrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,18px) scale(1.06)}100%{transform:translate(-18px,32px) scale(.96)}}

/* progress bar */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;
  background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .1s linear}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;
  padding:14px 28px;background:rgba(4,13,26,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--brd)}
.topbar .back{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);
  font-size:.82rem;color:var(--soft);padding:8px 14px;border:1px solid var(--brd);
  border-radius:10px;background:var(--surf);transition:.15s;white-space:nowrap}
.topbar .back:hover{background:var(--surf-h);color:var(--text);border-color:var(--brd-h)}
.topbar .crumb{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .crumb b{color:var(--soft)}
.topbar .spacer{flex:1}

.shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 28px}

/* ── LIST MODE ─────────────────────────────────────── */
.head{padding:56px 0 8px}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
h1.page-title{font-family:var(--font-head);font-size:clamp(2rem,5vw,3.2rem);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.page-sub{color:var(--soft);font-size:1.02rem;max-width:680px;margin-top:14px;line-height:1.6}

.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:34px 0 18px}
.tab{font-family:var(--font-mono);font-size:.86rem;padding:10px 18px;border-radius:12px;
  border:1px solid var(--brd);background:var(--surf);color:var(--soft);cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--brd-h);color:var(--text)}
.tab.active{border-color:var(--dsf-c);color:var(--dsf-c);background:color-mix(in srgb,var(--dsf-c) 12%,transparent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{font-family:var(--font-mono);font-size:.72rem;padding:6px 12px;border-radius:20px;
  border:1px solid var(--brd);background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.chip:hover{color:var(--text);border-color:var(--brd-h)}
.chip.active{color:var(--dsf-c);border-color:var(--dsf-c);background:color-mix(in srgb,var(--dsf-c) 14%,transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:80px}
.card{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:var(--r-lg);
  border:1px solid var(--brd);background:var(--surf);cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dsf-c);opacity:.0;transition:.18s}
.card:hover{transform:translateY(-4px);border-color:var(--brd-h);background:var(--surf-h)}
.card:hover::before{opacity:1}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--font-mono);font-size:.66rem;padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em}
.badge.basica{background:var(--grn-d);color:var(--green)}
.badge.media{background:var(--yel-d);color:var(--yellow)}
.badge.alta{background:rgba(255,96,96,.14);color:var(--red)}
.date{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-left:auto}
.card h3{font-family:var(--font-head);font-size:1.05rem;font-weight:700;line-height:1.3}
.card .excerpt{font-size:.86rem;color:var(--soft);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-family:var(--font-mono);font-size:.64rem;padding:3px 8px;border-radius:20px;
  background:var(--cyan-d);color:var(--cyan);border:1px solid rgba(62,232,255,.18)}
.card .open-hint{font-family:var(--font-mono);font-size:.72rem;color:var(--dsf-c);margin-top:4px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--brd);border-radius:var(--r-lg)}
.empty a{color:var(--cyan);display:inline-block;margin-top:10px}

/* ── READER (ARTICLE) MODE ─────────────────────────── */
.article{max-width:820px;margin:0 auto;padding:48px 0 120px}
.art-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.branch-chip{font-family:var(--font-mono);font-size:.72rem;padding:5px 12px;border-radius:20px;
  border:1px solid var(--dsf-c);color:var(--dsf-c);background:color-mix(in srgb,var(--dsf-c) 10%,transparent)}
h1.art-title{font-family:var(--font-head);font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:800;
  line-height:1.08;letter-spacing:-.02em;margin-bottom:14px}
.art-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:30px}
.art-divider{border:none;border-top:1px solid var(--brd);margin:0 0 34px}

/* rendered markdown — leitura contínua elegante */
.prose{font-size:1.06rem;line-height:1.78;color:#cfe0f0}
.prose>*+*{margin-top:1.05em}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--font-head);color:var(--text);
  line-height:1.25;letter-spacing:-.01em;scroll-margin-top:80px}
.prose h1{font-size:1.9rem;margin-top:2em;padding-bottom:.3em;border-bottom:1px solid var(--brd)}
.prose h2{font-size:1.5rem;margin-top:1.9em;color:var(--cyan)}
.prose h3{font-size:1.2rem;margin-top:1.6em;color:var(--violet)}
.prose h4{font-size:1.02rem;margin-top:1.3em;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono)}
.prose p{color:#cfe0f0}
.prose strong{color:#fff;font-weight:700}
.prose em{color:#e9d8ff}
.prose a{color:var(--cyan);border-bottom:1px solid rgba(62,232,255,.35)}
.prose a:hover{border-color:var(--cyan)}
.prose code{font-family:var(--font-mono);font-size:.86em;background:rgba(62,232,255,.10);
  color:var(--cyan);padding:2px 7px;border-radius:6px}
.prose pre{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);
  padding:18px;overflow-x:auto}
.prose pre code{background:none;color:#bcd3ea;padding:0;font-size:.9rem;line-height:1.6}
.prose blockquote{border-left:3px solid var(--cyan);background:var(--cyan-d);
  padding:12px 20px;border-radius:0 var(--r) var(--r) 0;color:#dcebf7}
.prose blockquote>*+*{margin-top:.6em}
.prose ul,.prose ol{padding-left:1.4em}
.prose li{margin:.4em 0}
.prose li::marker{color:var(--cyan)}
.prose hr{border:none;border-top:1px solid var(--brd);margin:2.4em 0}
.prose table{border-collapse:collapse;width:100%;font-size:.94rem;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--brd);padding:10px 14px;text-align:left;vertical-align:top}
.prose th{background:var(--surf);color:var(--text);font-family:var(--font-head);font-weight:700}
.prose tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.prose del{color:var(--muted)}

/* prev/next nav */
.art-nav{max-width:820px;margin:60px auto 0;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.art-nav a{flex:1;min-width:220px;padding:16px 20px;border:1px solid var(--brd);border-radius:var(--r-lg);
  background:var(--surf);transition:.15s}
.art-nav a:hover{background:var(--surf-h);border-color:var(--brd-h);transform:translateY(-2px)}
.art-nav .lab{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.art-nav .ttl{font-family:var(--font-head);font-weight:700;margin-top:6px;color:var(--text)}
.art-nav .next{text-align:right}
.loading{padding:80px 20px;text-align:center;color:var(--muted);font-family:var(--font-mono)}

/* back-to-top */
#topBtn{position:fixed;right:22px;bottom:22px;z-index:40;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--brd-h);background:var(--bg3);color:var(--text);cursor:pointer;font-size:1.1rem;
  opacity:0;pointer-events:none;transition:opacity .25s}
#topBtn.show{opacity:1;pointer-events:auto}

@media(max-width:600px){
  .shell{padding:0 18px}
  .topbar{padding:12px 18px}
  .article{padding:32px 0 90px}
  .prose{font-size:1.0rem}
}
</style>

<body>
<div id="progress"></div>
<div class="orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>

<header class="topbar">
  <a class="back" href="../index.html#desafios">← Voltar ao site</a>
  <div class="crumb" id="crumb">Desafios Clínicos</div>
  <div class="spacer"></div>
  <a class="back" id="allLink" href="./">📚 Todos os desafios</a>
</header>

<main class="shell" id="root">
  <div class="loading">Carregando desafios…</div>
</main>

<button id="topBtn" title="Voltar ao topo" aria-label="Voltar ao topo">⬆</button>

<script>
/* ── Markdown renderer (block-based, robusto p/ leitura contínua) ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/__([^_]+)__/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(md){
  if(!md) return '';
  const lines=md.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  let out='',i=0;
  const isBlank=l=>/^\s*$/.test(l);
  const isHeading=l=>/^#{1,6}\s/.test(l);
  const isUL=l=>/^\s*[-*+]\s+/.test(l);
  const isOL=l=>/^\s*\d+\.\s+/.test(l);
  const isHR=l=>/^\s*([-*_])\1{2,}\s*$/.test(l);
  while(i<lines.length){
    const line=lines[i];
    // code fence
    if(/^\s*```/.test(line)){
      const buf=[];i++;
      while(i<lines.length && !/^\s*```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      out+=`<pre><code>${esc(buf.join('\n'))}</code></pre>`;continue;
    }
    // heading
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){const lvl=Math.min(h[1].length,4);out+=`<h${lvl}>${inline(h[2].trim())}</h${lvl}>`;i++;continue;}
    // hr
    if(isHR(line)){out+='<hr>';i++;continue;}
    // blockquote
    if(/^\s*>\s?/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      out+=`<blockquote>${renderMarkdown(buf.join('\n'))}</blockquote>`;continue;
    }
    // table
    if(/^\s*\|.*\|\s*$/.test(line) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const th=cells(line).map(c=>`<th>${inline(c)}</th>`).join('');
      i+=2;const rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && lines[i].trim()){rows.push(lines[i]);i++;}
      const trs=rows.map(r=>`<tr>${cells(r).map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('');
      out+=`<table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`;continue;
    }
    // unordered list
    if(isUL(line)){
      const buf=[];
      while(i<lines.length && isUL(lines[i])){buf.push(lines[i].replace(/^\s*[-*+]\s+/,''));i++;}
      out+=`<ul>${buf.map(it=>`<li>${inline(it)}</li>`).join('')}</ul>`;continue;
    }
    // ordered list
    if(isOL(line)){
      const buf=[];
      while(i<lines.length && isOL(lines[i])){buf.push(lines[i].replace(/^\s*\d+\.\s+/,''));i++;}
      out+=`<ol>${buf.map(it=>`<li>${inline(it)}</li>`).join('')}</ol>`;continue;
    }
    // blank
    if(isBlank(line)){i++;continue;}
    // paragraph (junta linhas consecutivas)
    const buf=[line];i++;
    while(i<lines.length && !isBlank(lines[i]) && !isHeading(lines[i]) && !isUL(lines[i])
          && !isOL(lines[i]) && !/^\s*>/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !isHR(lines[i])){
      buf.push(lines[i]);i++;
    }
    out+=`<p>${inline(buf.join(' '))}</p>`;
  }
  return out;
}

/* ── App ── */
const DIFF={basica:'Básica',media:'Média',alta:'Alta'};
const BRANCH_LABEL={temi:'TEMI — Medicina Intensiva',r3:'R3 — Clínica Médica Avançada'};
const BRANCH_COLOR={temi:'var(--cyan)',r3:'var(--green)'};
let data={temi:[],r3:[]};

function qp(name){return new URLSearchParams(location.search).get(name);}

function sortDesafios(list){
  return [...list].sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||String(b.date||'').localeCompare(String(a.date||'')));
}

function renderList(){
  let branch=qp('b')||'temi';
  if(!data[branch]) branch='temi';
  let activeTag=null;
  const root=document.getElementById('root');
  document.getElementById('crumb').innerHTML='Desafios Clínicos';

  function draw(){
    const color=BRANCH_COLOR[branch];
    const list=sortDesafios(data[branch]||[]);
    const items=activeTag?list.filter(d=>(d.tags||[]).includes(activeTag)):list;
    const allTags=[...new Set((data[branch]||[]).flatMap(d=>d.tags||[]))];

    root.innerHTML=`
      <section class="head">
        <div class="eyebrow">// banco de desafios</div>
        <h1 class="page-title">Desafios Clínicos 🏋️</h1>
        <p class="page-sub">Casos, questões e dúvidas de plantão — colados dos chats e eternizados aqui em leitura contínua. Clique em um desafio para abrir a página inteira.</p>
      </section>
      <div class="tabs" style="--dsf-c:${color}">
        <button class="tab ${branch==='temi'?'active':''}" data-b="temi" style="--dsf-c:var(--cyan)">🏥 TEMI — Medicina Intensiva</button>
        <button class="tab ${branch==='r3'?'active':''}" data-b="r3" style="--dsf-c:var(--green)">🩺 R3 — Clínica Médica Avançada</button>
      </div>
      <div class="filters" style="--dsf-c:${color}">${
        allTags.map(t=>`<button class="chip ${activeTag===t?'active':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')
      }</div>
      <div class="grid" style="--dsf-c:${color}">${
        items.length?items.map(d=>cardHtml(d,color)).join('')
        :`<div class="empty"><p>Nenhum desafio neste ramo ainda.</p>
            <a href="../admin/desafios.html">✎ Abrir editor e adicionar →</a></div>`
      }</div>`;

    root.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
      branch=b.dataset.b;activeTag=null;
      history.replaceState(null,'','?b='+branch);
      draw();
    }));
    root.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
      activeTag=activeTag===c.dataset.tag?null:c.dataset.tag;draw();
    }));
    root.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{
      location.href='?b='+card.dataset.b+'&id='+encodeURIComponent(card.dataset.id);
    }));
  }
  draw();
}

function cardHtml(d,color){
  const diff=d.difficulty||'media';
  return `<article class="card" data-id="${esc(d.id)}" data-b="${esc(qp('b')||'temi')}" style="--dsf-c:${color}">
    <div class="card-meta">
      ${d.featured?'<span style="color:var(--yellow)">★</span>':''}
      <span class="badge ${esc(diff)}">${esc(DIFF[diff]||'Média')}</span>
      <span class="date">${esc(d.date||'')}</span>
    </div>
    <h3>${esc(d.title||'Sem título')}</h3>
    <p class="excerpt">${esc(d.excerpt||String(d.content||'').replace(/[#*>`_]/g,'').slice(0,180))}</p>
    <div class="tags">${(d.tags||[]).slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="open-hint">Abrir leitura completa →</div>
  </article>`;
}

function renderReader(branch,id){
  const list=data[branch]||[];
  const idx=list.findIndex(x=>x.id===id);
  const d=list[idx];
  const root=document.getElementById('root');
  if(!d){
    root.innerHTML=`<div class="empty" style="margin-top:60px">
      <p>Desafio não encontrado.</p><a href="?b=${esc(branch)}">← Ver todos os desafios</a></div>`;
    return;
  }
  const color=BRANCH_COLOR[branch];
  const diff=d.difficulty||'media';
  document.documentElement.style.setProperty('--dsf-c',color);
  document.title=`${d.title} | Desafios Antigravity`;
  document.getElementById('crumb').innerHTML=`<b>Desafios</b> / ${esc(BRANCH_LABEL[branch]||branch)}`;
  document.getElementById('allLink').href='?b='+branch;

  const sorted=sortDesafios(list);
  const sIdx=sorted.findIndex(x=>x.id===id);
  const prev=sorted[sIdx-1], next=sorted[sIdx+1];

  root.innerHTML=`
    <article class="article" style="--dsf-c:${color}">
      <div class="art-meta">
        <span class="branch-chip">${esc(BRANCH_LABEL[branch]||branch)}</span>
        <span class="badge ${esc(diff)}">${esc(DIFF[diff]||'Média')}</span>
        <span class="date">${esc(d.date||'')}</span>
      </div>
      <h1 class="art-title">${esc(d.title||'Sem título')}</h1>
      <div class="art-tags">${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <hr class="art-divider"/>
      <div class="prose">${renderMarkdown(d.content||'')}</div>
    </article>
    <nav class="art-nav" style="--dsf-c:${color}">
      ${prev?`<a class="prev" href="?b=${branch}&id=${encodeURIComponent(prev.id)}">
        <div class="lab">← Anterior</div><div class="ttl">${esc(prev.title)}</div></a>`:'<span></span>'}
      ${next?`<a class="next" href="?b=${branch}&id=${encodeURIComponent(next.id)}">
        <div class="lab">Próximo →</div><div class="ttl">${esc(next.title)}</div></a>`:'<span></span>'}
    </nav>`;
  window.scrollTo(0,0);
}

async function init(){
  try{
    const res=await fetch('../data/desafios.json?t='+Date.now());
    if(res.ok) data=await res.json();
  }catch(e){}
  const id=qp('id'), b=qp('b')||'temi';
  if(id) renderReader(data[b]?b:'temi', id);
  else renderList();
}

/* progress + back-to-top */
const progress=document.getElementById('progress');
const topBtn=document.getElementById('topBtn');
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  progress.style.width=(h>0?(window.scrollY/h*100):0)+'%';
  topBtn.classList.toggle('show',window.scrollY>500);
},{passive:true});
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
window.addEventListener('popstate',init);

init();
</script>
</body>
</html>
