<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071422">
  <title>AldenirMed89 — modo offline</title>
  <script>
    try{
      const prefs=JSON.parse(localStorage.getItem("antigravity:a11y:v1")||"{}");
      const theme=prefs.theme;
      const contrast=prefs.contrast===true;
      const light=!contrast&&(
        theme==="light"||
        (theme==="system"&&matchMedia("(prefers-color-scheme: light)").matches)||
        (!["dark","light","system"].includes(theme)&&prefs.clarity===true)
      );
      document.documentElement.classList.toggle("a11y-contrast",contrast);
      document.documentElement.classList.toggle("a11y-light",light);
      document.documentElement.style.colorScheme=light?"light":"dark";
      document.querySelector('meta[name="theme-color"]').content=contrast?"#000000":light?"#ffffff":"#071422";
    }catch(_){}
  </script>
  <style>
    :root{
      color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --bg:#020b1f;--surface:#071831;--card:#0c2445;--border:#2dd4ff;
      --text:#f5f9ff;--muted:#c7d7ea;--focus:#ffb02e;--shadow:#0008;--dot:rgba(45,212,255,.09)
    }
    html.a11y-light{
      color-scheme:light;
      --bg:#fff;--surface:#f6f9fc;--card:#eef4f8;--border:#006b7d;
      --text:#102a43;--muted:#334e68;--focus:#855400;--shadow:#102a4324;--dot:rgba(16,42,67,.12)
    }
    html.a11y-contrast{
      color-scheme:dark;
      --bg:#000;--surface:#000;--card:#080808;--border:#fff;
      --text:#fff;--muted:#f1f5f9;--focus:#fde047;--shadow:none;--dot:transparent
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,var(--dot) 1px,transparent 1px);background-size:32px 32px}
    main{position:relative;width:min(680px,100%);padding:32px;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:0 24px 80px var(--shadow)}
    img{width:96px;height:96px;border-radius:22px}
    h1{font-size:clamp(1.8rem,5vw,3rem);margin:.8rem 0}
    p{color:var(--muted);line-height:1.6}
    nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
    a,button{min-height:44px;padding:11px 15px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);text-decoration:none;font:inherit;cursor:pointer}
    a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    @media print{body{background:#fff;color:#102a43}body::before,#theme{display:none}main{border-color:#71869a;background:#fff;box-shadow:none}p{color:#334e68}}
  </style>
</head>
<body>
  <main>
    <img src="assets/icons/aldenirmed89-aerospace-orbital-192.png" alt="">
    <h1>Você está offline.</h1>
    <p>O núcleo clínico previamente carregado continua disponível. Reconecte-se para atualizar biblioteca, feed e referências externas.</p>
    <nav aria-label="Ações offline">
      <a href="./">Tentar página inicial</a>
      <a href="01_Modulos_Clinicos/Hematologia_Critica/index.html">Hematologia</a>
      <a href="01_Modulos_Clinicos/Reumatologia_Critica/index.html">Reumatologia</a>
      <button id="theme" type="button" aria-pressed="false">☀️ Visualização clara</button>
      <button id="retry" type="button">Tentar novamente</button>
    </nav>
  </main>
  <script>
    const a11yKey="antigravity:a11y:v1";
    const themeButton=document.getElementById("theme");
    function readPrefs(raw){
      try{
        const parsed=JSON.parse(raw===undefined?localStorage.getItem(a11yKey)||"{}":raw||"{}");
        return parsed&&typeof parsed==="object"&&!Array.isArray(parsed)?parsed:{};
      }catch(_){return {}}
    }
    let prefs=readPrefs();
    function clarityEnabled(preferences){
      if(preferences.contrast===true)return false;
      if(preferences.theme==="light")return true;
      if(preferences.theme==="dark")return false;
      if(preferences.theme==="system")return matchMedia("(prefers-color-scheme: light)").matches;
      return preferences.clarity===true;
    }
    function applyTheme({persist=false}={}){
      const active=clarityEnabled(prefs);
      const contrast=prefs.contrast===true;
      document.documentElement.classList.toggle("a11y-contrast",contrast);
      document.documentElement.classList.toggle("a11y-light",active);
      document.documentElement.style.colorScheme=active?"light":"dark";
      document.querySelector('meta[name="theme-color"]').content=contrast?"#000000":active?"#ffffff":"#071422";
      themeButton.setAttribute("aria-pressed",String(active));
      themeButton.textContent=active?"🌙 Modo aeroespacial escuro":"☀️ Visualização clara";
      if(persist){
        try{localStorage.setItem(a11yKey,JSON.stringify(prefs))}catch(_){}
      }
    }
    themeButton.addEventListener("click",()=>{
      prefs=readPrefs();
      const active=clarityEnabled(prefs);
      prefs.clarity=!active;
      prefs.theme=prefs.clarity?"light":"dark";
      if(prefs.clarity)prefs.contrast=false;
      applyTheme({persist:true});
    });
    window.addEventListener("storage",event=>{
      if(event.key!==a11yKey)return;
      prefs=readPrefs(event.newValue);
      applyTheme();
    });
    const systemTheme=matchMedia("(prefers-color-scheme: light)");
    const syncOfflineSystemTheme=()=>{
      prefs=readPrefs();
      if(prefs.theme==="system")applyTheme();
    };
    if(systemTheme.addEventListener)systemTheme.addEventListener("change",syncOfflineSystemTheme);
    else systemTheme.addListener?.(syncOfflineSystemTheme);
    document.getElementById("retry").addEventListener("click", () => location.reload());
    applyTheme();
  </script>
</body>
</html>
