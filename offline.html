<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071422">
  <title>Antigravity Consultas — modo offline</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#040d1a;color:#e4edf8}
    main{width:min(680px,100%);padding:32px;border:1px solid #29415a;border-radius:24px;background:#071422;box-shadow:0 24px 80px #0008}
    img{width:96px;height:96px;border-radius:22px}
    h1{font-size:clamp(1.8rem,5vw,3rem);margin:.8rem 0}
    p{color:#b8cce0;line-height:1.6}
    nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
    a,button{min-height:44px;padding:11px 15px;border-radius:12px;border:1px solid #3ee8ff;background:#0b1a2e;color:#e4edf8;text-decoration:none;font:inherit;cursor:pointer}
    a:focus-visible,button:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="assets/icons/antigravity-consultas-192.png" alt="">
    <h1>Você está offline.</h1>
    <p>O núcleo clínico previamente carregado continua disponível. Reconecte-se para atualizar biblioteca, feed e referências externas.</p>
    <nav aria-label="Ações offline">
      <a href="./">Tentar página inicial</a>
      <a href="01_Modulos_Clinicos/Hematologia_Critica/index.html">Hematologia</a>
      <a href="01_Modulos_Clinicos/Reumatologia_Critica/index.html">Reumatologia</a>
      <button id="retry" type="button">Tentar novamente</button>
    </nav>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
