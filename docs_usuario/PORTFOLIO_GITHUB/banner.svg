<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Aldenir Rocha — Projeto 360X</title>
  <desc id="banner-description">Banner em azul-marinho com detalhes em verde-petróleo e dourado. Aldenir Rocha: Medicina, Educação e Inteligência artificial. Conhecimento claro. Tecnologia com propósito.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081b2d"/>
      <stop offset="1" stop-color="#102d40"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ed2c4"/>
      <stop offset="0.62" stop-color="#1c8f91"/>
      <stop offset="1" stop-color="#d9b569"/>
    </linearGradient>
    <clipPath id="canvas">
      <rect width="1200" height="340" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1200" height="340" fill="url(#background)"/>
    <g fill="none" stroke="#3ed2c4" stroke-width="1.5" opacity="0.12">
      <circle cx="1165" cy="328" r="248"/>
      <circle cx="1165" cy="328" r="188"/>
      <circle cx="1165" cy="328" r="128"/>
      <path d="M937 340 L1200 77 M1002 340 L1200 142"/>
    </g>
    <rect x="0" y="332" width="1200" height="8" fill="url(#edge)"/>
    <rect x="64" y="91" width="76" height="4" rx="2" fill="#d9b569"/>
    <rect x="910" y="40" width="226" height="46" rx="23" fill="#133e49" stroke="#3c8c8c" stroke-width="1"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="64" y="67" font-size="18" font-weight="700" letter-spacing="2" fill="#80dcd3">CONHECIMENTO EM MOVIMENTO</text>
      <text x="1023" y="69" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2" fill="#dcefeb">PROJETO 360X</text>
      <text x="60" y="176" font-size="78" font-weight="700" letter-spacing="-2" fill="#ffffff">Aldenir Rocha</text>
      <text x="64" y="230" font-size="30" font-weight="400" fill="#e5f3f4">Medicina · Educação · Inteligência artificial</text>
      <text x="64" y="286" font-size="22" font-weight="400" fill="#abc6cf">Conhecimento claro. Tecnologia com propósito.</text>
    </g>
  </g>
</svg>
