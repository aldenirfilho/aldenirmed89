<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Calculadora de Vasoativas v2 | UpDown Hub</title>
  <script>
    (() => {
      try {
        const saved = JSON.parse(localStorage.getItem('antigravity:a11y:v1') || '{}');
        const prefs = saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        const statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (prefs.contrast === true) {
          document.documentElement.classList.add('a11y-contrast');
          document.documentElement.style.colorScheme = 'dark';
          themeMeta.content = '#000000';
          statusMeta.content = 'black-translucent';
        } else if (
          prefs.theme === 'light' ||
          (prefs.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches) ||
          (!['dark', 'light', 'system'].includes(prefs.theme) && prefs.clarity === true)
        ) {
          document.documentElement.classList.add('a11y-light');
          document.documentElement.style.colorScheme = 'light';
          themeMeta.content = '#ffffff';
          statusMeta.content = 'default';
        }
      } catch (_) {
        // Uma preferência inválida não deve impedir o uso da calculadora.
      }
    })();
  </script>
  <link rel="stylesheet" href="../../assets/estudos.css" />
  <style>
    :root { color-scheme: dark; --p: #38bdf8; --s: #4ef0a1; --warn: #fb7185; }
    .calc-container { max-width: 800px; margin: 0 auto; padding: 1rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 0.4rem; }
    input, select { width: 100%; padding: 0.8rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; }
    .result-panel { background: linear-gradient(135deg, rgba(56,189,248,0.1), rgba(78,240,161,0.05)); border: 1px solid var(--accent); border-radius: 20px; padding: 1.5rem; margin-top: 2rem; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: center; }
    .result-val { font-size: 2.2rem; font-weight: 900; color: var(--accent2); display: block; }
    .prescription-box { background: #000; color: #fff; padding: 1rem; border-radius: 12px; font-family: monospace; font-size: 0.85rem; margin-top: 1rem; white-space: pre-wrap; position: relative; }
    .copy-btn { position: absolute; top: 10px; right: 10px; background: var(--accent); border: none; padding: 5px 10px; border-radius: 5px; color: #000; cursor: pointer; font-size: 0.7rem; font-weight: 800; }
    .warning-box { background: rgba(251,113,133,0.1); border: 1px solid var(--danger); color: var(--danger); padding: 1rem; border-radius: 12px; font-size: 0.8rem; margin-top: 1rem; }
    .tabs { display: flex; gap: 5px; margin-bottom: 1.5rem; }
    .tab { flex: 1; padding: 0.8rem; text-align: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 0.8rem; }
    .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .manual-dilution { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem; }
    .clarity-toggle { min-height: 44px; padding: 0.5rem 0.8rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); cursor: pointer; font: 800 0.78rem/1 Inter, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .clarity-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .clarity-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.12); }
    :where(a, button, input, select, [tabindex]):focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    html.a11y-light {
      color-scheme: light;
      --bg: #ffffff; --bg2: #edf4f8; --card: #ffffff; --text: #102a43;
      --muted: #536b7d; --border: #71869a; --accent: #006b7d; --accent2: #087a55;
      --gold: #855400; --danger: #b4233f; --p: #006b7d; --s: #087a55; --warn: #b4233f;
    }
    html.a11y-light body { background: #fff; }
    html.a11y-light .topbar { background: rgba(255,255,255,0.96); border-color: #71869a; box-shadow: 0 6px 20px rgba(16,42,67,0.08); }
    html.a11y-light .panel { background: #fff; border-color: #71869a; box-shadow: 0 12px 36px rgba(16,42,67,0.08); }
    html.a11y-light input,
    html.a11y-light select,
    html.a11y-light .tab { background: #fff; color: #102a43; border-color: #71869a; }
    html.a11y-light .tab.active { background: #006b7d; color: #fff; border-color: #006b7d; }
    html.a11y-light .result-panel { background: linear-gradient(135deg,#edf9fb,#eefaf5); border-color: #006b7d; }
    html.a11y-light .prescription-box { background: #fff; color: #102a43; border: 1px solid #71869a; }
    html.a11y-light .copy-btn { background: #006b7d; color: #fff; border: 1px solid #004f5e; }
    html.a11y-light .warning-box { background: #fff0f3; border-color: #b4233f; color: #8a1730; }
    html.a11y-light footer { color: #536b7d; opacity: 1 !important; }
    html.a11y-light .clarity-toggle[aria-pressed="true"] { background: #e5f7fa; }
    html.a11y-light :where(a, button, input, select, [tabindex]):focus-visible { outline-color: #855400; }

    html.a11y-contrast {
      color-scheme: dark;
      --bg: #000; --bg2: #080808; --card: #000; --text: #fff; --muted: #fff;
      --border: #fff; --accent: #00ffff; --accent2: #7fff7f; --gold: #ffff00;
      --danger: #ff8080; --p: #00ffff; --s: #7fff7f; --warn: #ff8080;
    }
    html.a11y-contrast body,
    html.a11y-contrast .topbar { background: #000; }
    html.a11y-contrast .panel,
    html.a11y-contrast .result-panel { background: #000; border-color: #fff; box-shadow: none; }
    html.a11y-contrast .prescription-box { border: 1px solid #fff; }
    html.a11y-contrast :where(a, button, input, select, [tabindex]):focus-visible { outline: 3px solid #ffff00; outline-offset: 3px; }

    @media print {
      html, html.a11y-light, html.a11y-contrast {
        color-scheme: light;
        --bg: #fff; --bg2: #fff; --card: #fff; --text: #102a43; --muted: #455f73;
        --border: #71869a; --accent: #006b7d; --accent2: #087a55; --gold: #855400;
        --danger: #b4233f; --p: #006b7d; --s: #087a55; --warn: #b4233f;
      }
      body { background: #fff !important; color: #102a43 !important; }
      .topbar nav, .clarity-toggle, .copy-btn { display: none !important; }
      .topbar { position: static !important; background: #fff !important; border-color: #71869a !important; }
      .panel, .result-panel, .prescription-box, input, select, .tab {
        background: #fff !important; color: #102a43 !important; border-color: #71869a !important;
        box-shadow: none !important; break-inside: avoid; page-break-inside: avoid;
      }
      .tab.active { background: #edf9fb !important; color: #005466 !important; border-color: #006b7d !important; }
      label, .muted, footer { color: #455f73 !important; opacity: 1 !important; }
      .result-val { color: #087a55 !important; }
      .warning-box { background: #fff !important; color: #8a1730 !important; border-color: #b4233f !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    @media (max-width: 560px) {
      .topbar { align-items: stretch; }
      .topbar nav { width: 100%; }
      .clarity-toggle, .topbar nav a { flex: 1 1 auto; }
      .manual-dilution, .result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html">💊 <span>Vasoativas v2</span></a>
    <nav>
      <button class="clarity-toggle" id="clarity-toggle" type="button" aria-pressed="false" aria-label="Ativar visualização clara com fundo branco" title="Ativar visualização clara">
        <span aria-hidden="true">☀️</span><span class="clarity-label">Visualização clara</span>
      </button>
      <a href="../index.html">⬅️ Apps</a>
    </nav>
  </header>

  <main class="calc-container">
    <section class="panel">
      <div class="form-group">
        <label>1. Peso do Paciente (kg)</label>
        <input type="number" id="weight" value="70" step="0.1" oninput="calc()">
      </div>

      <div class="form-group">
        <label>2. Droga Vasoativa</label>
        <select id="drugSelect" onchange="onDrugChange()"></select>
      </div>

      <div class="form-group">
        <label>3. Preparo da Solução</label>
        <select id="presetSelect" onchange="onPresetChange()"></select>
        <div class="manual-dilution" id="manualDilution" style="display:none">
          <div><label>Total (mg ou UI)</label><input type="number" id="manualTotal" oninput="calc()"></div>
          <div><label>Volume Final (mL)</label><input type="number" id="manualVol" oninput="calc()"></div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Sentido do cálculo">
        <button class="tab active" id="tabDose" type="button" role="tab" aria-selected="true" aria-controls="inputDoseGroup" onclick="setMode('dose')">Dose → mL/h</button>
        <button class="tab" id="tabFlow" type="button" role="tab" aria-selected="false" aria-controls="inputFlowGroup" onclick="setMode('flow')">mL/h → Dose</button>
      </div>

      <div class="form-group" id="inputDoseGroup" role="tabpanel" aria-labelledby="tabDose">
        <label id="doseLabel">Dose Alvo (mcg/kg/min)</label>
        <input type="number" id="inputDose" step="0.01" oninput="calc()">
      </div>

      <div class="form-group" id="inputFlowGroup" role="tabpanel" aria-labelledby="tabFlow" style="display:none">
        <label>Vazão Atual (mL/h)</label>
        <input type="number" id="inputFlow" step="0.1" oninput="calc()">
      </div>
    </section>

    <section class="result-panel">
      <div class="result-grid">
        <div>
          <span class="muted" id="resLabel1">Vazão Sugerida</span>
          <strong class="result-val" id="resVal1">0.0</strong>
          <span class="muted" id="resUnit1">mL/h</span>
        </div>
        <div>
          <span class="muted">Concentração</span>
          <strong class="result-val" id="resVal2" style="font-size: 1.2rem; color: var(--accent);">0</strong>
          <span class="muted" id="resUnit2">mcg/mL</span>
        </div>
      </div>

      <div class="prescription-box" id="presc">
        <!-- Prescrição será gerada aqui -->
      </div>
      <button class="copy-btn" onclick="copyPresc()">Copiar</button>
    </section>

    <div class="warning-box" id="warning">
      Conferir apresentação da ampola e protocolo institucional.
    </div>

    <footer style="margin-top: 3rem; font-size: 0.7rem; text-align: center; opacity: 0.6;">
      UpDown Hub Clinical Tool • v2.0 • Antigravity Engine
    </footer>
  </main>

  <script>
    const A11Y_PREFERENCES_KEY = 'antigravity:a11y:v1';
    const DARK_THEME_COLOR = '#07111f';
    const LIGHT_THEME_COLOR = '#ffffff';
    const CONTRAST_THEME_COLOR = '#000000';

    function parseA11yPreferences(raw) {
      try {
        const parsed = JSON.parse(raw || '{}');
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      } catch (_) {
        return {};
      }
    }

    function readA11yPreferences() {
      try {
        return parseA11yPreferences(localStorage.getItem(A11Y_PREFERENCES_KEY));
      } catch (_) {
        return {};
      }
    }

    let vasoactiveA11yPreferences = readA11yPreferences();
    function vasoactiveClarityEnabled(preferences) {
      if (preferences.contrast === true) return false;
      if (preferences.theme === 'light') return true;
      if (preferences.theme === 'dark') return false;
      if (preferences.theme === 'system') {
        return matchMedia('(prefers-color-scheme: light)').matches;
      }
      return preferences.clarity === true;
    }

    function applyVasoactiveTheme({persist = false} = {}) {
      const root = document.documentElement;
      const contrastActive = vasoactiveA11yPreferences.contrast === true;
      const clarityActive = vasoactiveClarityEnabled(vasoactiveA11yPreferences);
      const button = document.getElementById('clarity-toggle');
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');

      root.classList.toggle('a11y-light', clarityActive);
      root.classList.toggle('a11y-contrast', contrastActive);
      root.style.colorScheme = clarityActive ? 'light' : 'dark';
      themeMeta?.setAttribute('content', clarityActive ? LIGHT_THEME_COLOR : contrastActive ? CONTRAST_THEME_COLOR : DARK_THEME_COLOR);
      statusMeta?.setAttribute('content', clarityActive ? 'default' : 'black-translucent');

      if (button) {
        button.setAttribute('aria-pressed', String(clarityActive));
        button.setAttribute('aria-label', clarityActive ? 'Voltar ao modo espacial escuro' : 'Ativar visualização clara com fundo branco');
        button.title = clarityActive ? 'Voltar ao modo espacial escuro' : 'Ativar visualização clara';
        button.querySelector('[aria-hidden="true"]').textContent = clarityActive ? '🌙' : '☀️';
        button.querySelector('.clarity-label').textContent = clarityActive ? 'Modo espacial' : 'Visualização clara';
      }

      if (persist) {
        try {
          localStorage.setItem(A11Y_PREFERENCES_KEY, JSON.stringify(vasoactiveA11yPreferences));
        } catch (_) {
          // A interface continua funcional mesmo sem armazenamento local.
        }
      }
    }

    document.getElementById('clarity-toggle')?.addEventListener('click', () => {
      const current = readA11yPreferences();
      const clarityActive = vasoactiveClarityEnabled(current);
      vasoactiveA11yPreferences = {
        ...current,
        clarity: !clarityActive,
        theme: clarityActive ? 'dark' : 'light'
      };
      if (vasoactiveA11yPreferences.clarity) vasoactiveA11yPreferences.contrast = false;
      applyVasoactiveTheme({persist: true});
    });

    window.addEventListener('storage', (event) => {
      if (event.key !== A11Y_PREFERENCES_KEY) return;
      vasoactiveA11yPreferences = parseA11yPreferences(event.newValue);
      applyVasoactiveTheme();
    });
    const vasoactiveSystemTheme = matchMedia('(prefers-color-scheme: light)');
    const handleVasoactiveSystemThemeChange = () => {
      vasoactiveA11yPreferences = readA11yPreferences();
      if (vasoactiveA11yPreferences.theme === 'system') applyVasoactiveTheme();
    };
    if (vasoactiveSystemTheme.addEventListener) {
      vasoactiveSystemTheme.addEventListener('change', handleVasoactiveSystemThemeChange);
    } else {
      vasoactiveSystemTheme.addListener?.(handleVasoactiveSystemThemeChange);
    }

    applyVasoactiveTheme();

    let drugs = [];
    let mode = 'dose';

    async function init() {
      // Tentativa de carregar do JSON se estiver no servidor, senão fallback
      try {
        const res = await fetch('../../data/vasoactive_drugs_brasil_presets.json');
        const data = await res.json();
        drugs = data.drugs;
      } catch(e) {
        // Fallback básico se o fetch falhar
        drugs = [
          {id:'noradrenalina', name:'Noradrenalina', unit:'mcg/kg/min', requires_weight:true, presets:[{label:'16 mg em 100 mL', mg_total:16, final_volume_ml:100, concentration_mcg_ml:160}]}
        ];
      }
      populateDrugs();
      onDrugChange();
    }

    function populateDrugs() {
      const select = document.getElementById('drugSelect');
      select.innerHTML = drugs.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    }

    function onDrugChange() {
      const drug = drugs.find(d => d.id === document.getElementById('drugSelect').value);
      const presetSelect = document.getElementById('presetSelect');
      
      let html = drug.presets.map((p, i) => `<option value="${i}">${p.label}</option>`).join('');
      html += `<option value="manual">Outro preparo (manual)</option>`;
      presetSelect.innerHTML = html;
      
      document.getElementById('doseLabel').textContent = `Dose Alvo (${drug.unit})`;
      document.getElementById('resUnit2').textContent = drug.unit.split('/')[0] + '/mL';
      
      onPresetChange();
    }

    function onPresetChange() {
      const val = document.getElementById('presetSelect').value;
      document.getElementById('manualDilution').style.display = (val === 'manual') ? 'grid' : 'none';
      calc();
    }

    function setMode(m) {
      mode = m;
      const doseTab = document.getElementById('tabDose');
      const flowTab = document.getElementById('tabFlow');
      doseTab.className = (m === 'dose') ? 'tab active' : 'tab';
      flowTab.className = (m === 'flow') ? 'tab active' : 'tab';
      doseTab.setAttribute('aria-selected', String(m === 'dose'));
      flowTab.setAttribute('aria-selected', String(m === 'flow'));
      document.getElementById('inputDoseGroup').style.display = (m === 'dose') ? 'block' : 'none';
      document.getElementById('inputFlowGroup').style.display = (m === 'flow') ? 'block' : 'none';
      document.getElementById('resLabel1').textContent = (m === 'dose') ? 'Vazão Sugerida' : 'Dose Calculada';
      document.getElementById('resUnit1').textContent = (m === 'dose') ? 'mL/h' : drugs.find(d => d.id === document.getElementById('drugSelect').value).unit;
      calc();
    }

    function calc() {
      const drug = drugs.find(d => d.id === document.getElementById('drugSelect').value);
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const presetIdx = document.getElementById('presetSelect').value;
      
      let totalMass, finalVol;
      if (presetIdx === 'manual') {
        totalMass = parseFloat(document.getElementById('manualTotal').value) || 0;
        finalVol = parseFloat(document.getElementById('manualVol').value) || 1;
      } else {
        const p = drug.presets[presetIdx];
        totalMass = p.mg_total || p.ui_total;
        finalVol = p.final_volume_ml;
      }

      const concentration = (totalMass * (drug.unit.includes('mcg') ? 1000 : 1)) / finalVol;
      document.getElementById('resVal2').textContent = concentration.toFixed(concentration < 1 ? 2 : 1);

      let result = 0;
      if (mode === 'dose') {
        const dose = parseFloat(document.getElementById('inputDose').value) || 0;
        if (drug.unit === 'mcg/kg/min') {
          result = (dose * weight * 60) / concentration;
        } else {
          result = (dose * 60) / concentration;
        }
        document.getElementById('resVal1').textContent = result.toFixed(1);
      } else {
        const flow = parseFloat(document.getElementById('inputFlow').value) || 0;
        if (drug.unit === 'mcg/kg/min') {
          result = (flow * concentration) / (weight * 60);
        } else {
          result = (flow * concentration) / 60;
        }
        document.getElementById('resVal1').textContent = result.toFixed(2);
      }

      generatePrescription(drug, totalMass, finalVol, concentration, weight);
    }

    function generatePrescription(drug, mass, vol, conc, weight) {
      const unit = drug.unit.split('/')[0].toUpperCase();
      const dose = mode === 'dose' ? (parseFloat(document.getElementById('inputDose').value) || 0) : document.getElementById('resVal1').textContent;
      const flow = mode === 'dose' ? document.getElementById('resVal1').textContent : (parseFloat(document.getElementById('inputFlow').value) || 0);
      
      const massUnit = drug.unit.includes('mcg') ? 'mg' : 'UI';
      
      let txt = `${drug.name.toUpperCase()} ${mass} ${massUnit} + Solvente q.s.p. ${vol} mL.\n`;
      txt += `Concentração: ${conc.toFixed(1)} ${unit}/mL.\n`;
      txt += `Administrar em BIC a ${flow} mL/h, equivalente a ${dose} ${drug.unit}`;
      if(drug.requires_weight) txt += ` para ${weight} kg.`;
      txt += `\nTitular conforme metas hemodinâmicas.`;
      
      document.getElementById('presc').innerText = txt;
      
      let warn = drug.critical_note || "Conferir compatibilidade e estabilidade da solução.";
      if (flow > 100) warn = "⚠️ VAZÃO ALTA (> 100 mL/h). Considere concentrar a solução.";
      if (dose > 2) warn = "⚠️ DOSE MUITO ALTA. Avalie teto terapêutico e drogas adjuvantes.";
      document.getElementById('warning').innerText = warn;
    }

    function copyPresc() {
      const txt = document.getElementById('presc').innerText;
      navigator.clipboard.writeText(txt);
      alert("Prescrição copiada para o clipboard!");
    }

    init();
  </script>
</body>
</html>
