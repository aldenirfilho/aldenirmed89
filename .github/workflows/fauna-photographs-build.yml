name: Preparar fotografias da Fauna
on:
  push:
    branches: [feat/fauna-fotografias-reais-20261022]
    paths: ['.github/workflows/fauna-photographs-build.yml']
permissions:
  contents: read
jobs:
  photographs:
    if: github.repository == 'aldenirfilho/aldenirmed89' && github.ref == 'refs/heads/feat/fauna-fotografias-reais-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fauna-fotografias-reais-20261022
          sparse-checkout: |
            apps/bolsa-ajuda-fauna
            scripts_admin
            data/editorial
            tests
            .github/workflows
      - name: Gerar fotografias e créditos a partir do código revisável
        run: python3 scripts_admin/add_fauna_photographs.py
      - name: Validar módulo e registro editorial sem alterar suas regras
        run: |
          set -e
          node --check apps/bolsa-ajuda-fauna/app.js
          python3 -m unittest discover -s tests -p 'test_fauna_site.py' -v
          python3 scripts_admin/editorial_gate.py --check --changed-file apps/bolsa-ajuda-fauna/app.js --changed-file apps/bolsa-ajuda-fauna/styles.css --changed-file apps/bolsa-ajuda-fauna/README.md --changed-file apps/bolsa-ajuda-fauna/photos.html --json
      - name: Gravar somente os arquivos autorizados na ramificação
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bolsa-ajuda-fauna/app.js apps/bolsa-ajuda-fauna/styles.css apps/bolsa-ajuda-fauna/README.md apps/bolsa-ajuda-fauna/photos.html data/editorial/registry.json
          git rm -- scripts_admin/fauna-photos-transfer-1.b64 scripts_admin/fauna-photos-transfer-2.b64 .github/workflows/fauna-photographs-build.yml
          git diff --cached --stat
          git commit -m 'feat(fauna): add attributed real photographs to all animal cards'
          git push origin HEAD:refs/heads/feat/fauna-fotografias-reais-20261022
