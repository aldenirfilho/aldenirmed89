name: Compilar Android de teste
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Testar e sincronizar aplicativo
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run sync
      - name: Compilar APK para teste
        working-directory: mobile/android
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Consultas-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
