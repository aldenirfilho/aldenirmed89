name: Integrar Fauna ao Ecossistema 360X
on:
  push:
    branches: [feat/fauna-ecossistema-360x-20261022]
    paths:
      - '.github/workflows/fauna-ecosystem-integrate.yml'
      - 'scripts_admin/integrate_fauna_ecossistema.py'
      - 'scripts_admin/check_fauna_ecossistema_browser.py'
      - 'tests/test_fauna_ecossistema.py'
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/fauna-ecossistema-360x-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fauna-ecossistema-360x-20261022
      - name: Conferir destino público e integrar somente navegação
        run: python3 scripts_admin/integrate_fauna_ecossistema.py --verify-public
      - name: Testar contratos e respeitar o gate editorial existente
        run: |
          set -e
          python3 -m unittest discover -s tests -p 'test_fauna*.py' -v
          python3 -m unittest discover -s tests -p 'test_universo_360x.py' -v
          python3 -m unittest discover -s tests -p 'test_mapa_360x.py' -v
          node --check ecossistema/assets/app.js
          node --check ecossistema/assets/mapa.js
          node --check apps/bolsa-ajuda-fauna/app.js
          python3 scripts_admin/editorial_gate.py --check --changed-file ecossistema/data/sites-360x.json --changed-file ecossistema/data/mapa-conexoes.json --changed-file ecossistema/data/catalog.json --changed-file ecossistema/assets/app.js --changed-file ecossistema/index.html --changed-file ecossistema/mapa.html --changed-file apps/bolsa-ajuda-fauna/index.html --json
      - name: Preparar navegador de validação
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
      - name: Verificar navegação desktop e celular
        run: python3 scripts_admin/check_fauna_ecossistema_browser.py
      - name: Preservar relatório e arquivos verificados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fauna-ecosystem-integration
          retention-days: 7
          path: |
            fauna-ecosystem-check/
            ecossistema/
            apps/bolsa-ajuda-fauna/
            data/editorial/registry.json
            tests/test_fauna_ecossistema.py
            scripts_admin/integrate_fauna_ecossistema.py
            scripts_admin/check_fauna_ecossistema_browser.py
      - name: Gravar apenas o escopo validado na ramificação
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ecossistema/data/sites-360x.json ecossistema/data/mapa-conexoes.json ecossistema/data/catalog.json ecossistema/assets/app.js ecossistema/index.html ecossistema/mapa.html apps/bolsa-ajuda-fauna/index.html data/editorial/registry.json
          git rm -- .github/workflows/fauna-ecosystem-integrate.yml
          git diff --cached --stat
          git commit -m 'feat(ecossistema): connect Fauna 360 to catalogue, map and public support paths'
          git push origin HEAD:feat/fauna-ecossistema-360x-20261022
