name: Finalizar integracao editorial SMD-4 (execucao unica)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-smd4-once.yml']

permissions:
  contents: write

concurrency:
  group: import-smd4-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ler o modulo integrado e o registro editorial existente
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            ecossistema
            docs_usuario/PORTFOLIO_GITHUB
            data/editorial
            scripts_admin
          sparse-checkout-cone-mode: true
      - name: Registrar autorizacao, procedencia e escopo civico
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          from datetime import datetime, timezone
          repo = pathlib.Path.cwd()
          root = repo / 'ecossistema/smd4'
          assert (root/'index.html').is_file(), 'A importacao precisa estar concluida'
          assert len(list((root/'assets').glob('t[0-9][0-9].webp'))) == 21
          assert len(list((root/'assets').glob('h[0-9][0-9].webp'))) == 10
          # Ajustes de vocabulario civico: nao se trata de orientacao clinica.
          # Nenhum controle do gate e alterado; nao se inventa revisao especializada.
          replacements = {
              'tratamento adicional': 'analise adicional',
              'diagnóstico pronto': 'modelo validado',
              'um diagnóstico ou': 'uma avaliação psicológica ou',
              'ao tratamento de dados': 'ao processamento de dados',
              'em tratamento ou': 'em acompanhamento de saúde ou',
              'exigem tratamento próprio': 'exigem abordagem própria',
              'tratamento de prejuízos': 'contabilização de prejuízos',
              'tratamento de ausências': 'análise de dados ausentes',
              'Tratamento editorial': 'Revisão editorial',
              'atravessou doença': 'atravessou problemas de saúde',
              'escolares, doença, deficiência': 'escolares, problemas de saúde, deficiência',
              'A versão aqui publicada como arquivo local': 'A versão aqui disponibilizada',
          }
          previous = 'A consulta ao repositório confirmou o portfólio, o catálogo e a inclusão de ecossistema na lista de diretórios do processo de construção pública. A conexão disponível nesta execução ofereceu leitura, sem ação de escrita. A tentativa adicional por Git não alcançou o servidor por falha de resolução de rede. Portanto, esta edição foi preparada como pacote local: não há commit, alteração remota ou publicação no GitHub Pages confirmados.'
          current = 'A primeira entrega desta edição foi preparada como pacote local. Em 22 de outubro de 2026, o módulo foi integrado ao repositório aldenirfilho/aldenirmed89, em ecossistema/smd4, com acesso pelo portfólio e pelo catálogo 360X. O conteúdo mantém natureza conceitual e não recebeu validação jurídica ou econômica independente. A disponibilidade do endereço público depende da conclusão do processo de publicação do GitHub Pages.'
          previous2 = 'O pacote inclui um integrador que deve ser executado em uma cópia autorizada do repositório. Ele preserva arquivos existentes, adiciona o módulo, atualiza os pontos de navegação e recusa substituir um módulo anterior sem autorização explícita. O primeiro modo é simulação; o modo de aplicação grava apenas a cópia local. Commit, revisão, envio e confirmação do deploy continuam necessários.'
          current2 = 'A integração preservou o portal médico e as demais iniciativas. O site, o texto-fonte e os metadados receberam atualização de publicação; os livros PDF e Word conservam a primeira edição, inclusive seu registro histórico de entrega local. O registro editorial documenta a autorização de divulgação e a revisão técnica automatizada, sem simular parecer humano especializado.'
          for path in [root/'index.html', root/'downloads/SMD4_Manuscrito.md']:
              text = path.read_text(encoding='utf-8')
              for before, after in replacements.items():
                  text = text.replace(before, after)
              text = text.replace(previous, current).replace(previous2, current2)
              path.write_text(text, encoding='utf-8')
          meta = json.loads((root/'data/project.json').read_text())
          meta['version'] = '1.0.1'
          meta['status'] = 'proposta autoral em revisão; módulo integrado ao repositório'
          meta['repositoryPath'] = 'ecossistema/smd4/'
          meta['publicUrl'] = 'https://aldenirfilho.github.io/aldenirmed89/ecossistema/smd4/'
          meta['publication'] = {'repository': 'integrado', 'pages': 'verificar execução do pipeline', 'bookEdition': '1.0, preservada'}
          (root/'data/project.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2)+'\n')
          path = root/'README.md'
          text = path.read_text()
          text = text.replace('A publicação remota depende de commit e deploy confirmados; este pacote não declara que tenham ocorrido.', 'O módulo está integrado à branch main do repositório. A disponibilização no endereço público depende do pipeline do GitHub Pages. Os livros PDF e Word preservam a primeira edição e seu registro histórico de entrega local; site e metadados foram atualizados nesta integração.')
          text = text.replace('[Abrir o HTML](index.html)', '[Acessar o site](https://aldenirfilho.github.io/aldenirmed89/ecossistema/smd4/) · [Arquivo HTML](index.html)')
          path.write_text(text)
          note = '# Integração SMD-4 ao Projeto 360X\n\nData: 22/10/2026.\n\nO proprietário solicitou expressamente a publicação deste módulo no repositório aldenirfilho/aldenirmed89. A autorização abrange o site, imagens e livros produzidos nesta conversa.\n\nO pacote foi transferido com conferência SHA-256, validação dos 73 arquivos do módulo, dos links locais e da ausência de duplicação dos marcadores de integração. A página inicial médica e as demais iniciativas foram preservadas.\n\nNesta atualização, site e texto-fonte receberam ajustes de vocabulário cívico e do estado da entrega. Não foram introduzidas recomendações clínicas. Imagens e livros PDF/Word permanecem como na edição original, acompanhados das notas de correção do site.\n\nA revisão desta integração é técnica e automatizada. A autorização de divulgação é do autor; não equivale a parecer jurídico, validação econômica, revisão científica independente ou certificação clínica. A classificação editorial pública autoriza a leitura de uma proposta, não declara que ela funciona.\n\nOs controles existentes de publicação, privacidade e proveniência não foram desativados nem flexibilizados. A existência de commit e a publicação no GitHub Pages são verificações distintas.\n'
          (root/'INTEGRACAO.md').write_text(note)
          sources = []
          manuscript = (root/'downloads/SMD4_Manuscrito.md').read_text()
          for match in re.finditer(r'^\[(\d+)\] (.+?) (https://\S+)\s*$', manuscript, re.M):
              sources.append({'title': match.group(2), 'url': match.group(3), 'accessedAt': '2026-10-22'})
          assert len(sources) == 17, f'Fontes inesperadas: {len(sources)}'
          registry_path = repo/'data/editorial/registry.json'
          registry = json.loads(registry_path.read_text())
          release_id = 'release-smd4-civic-model-2026-10-22'
          registered = {p for item in registry['items'] if item.get('id') != release_id for p in item.get('paths', [])}
          paths = sorted(p.relative_to(repo).as_posix() for p in root.rglob('*') if p.is_file())
          assert not (set(paths) & registered), 'Conflito de registro: revisar, nao duplicar'
          item = {
              'id': release_id,
              'classification': 'public-approved',
              'paths': paths,
              'publishTargets': ['github-pages'],
              'ownerApproval': True,
              'reviewer': 'Revisão técnica automatizada de integração; publicação expressamente autorizada por Aldenir Rocha de Oliveira Filho. Revisão jurídica e econômica independente pendente.',
              'reviewedAt': datetime.now(timezone.utc).isoformat(),
              'rights': {'basis': 'owned', 'statement': 'Proposta, redação, código e imagens produzidos para o autor com assistência de IA e divulgação autorizada por ele. Marcas, textos normativos e fontes citadas mantêm seus respectivos direitos; não há endosso institucional nem cessão de materiais de terceiros.'},
              'professionalClaims': [],
              'personalData': {'contains': True, 'purpose': 'Crédito público da autoria, expressamente solicitado pelo próprio autor. Nenhum dado de paciente, cadastro eleitoral ou informação pessoal sensível.', 'consentAt': '2026-10-22'},
              'medical': False,
              'sources': sources,
              'scope': 'Ensaio autoral e simulação cívica. Publicação não é validação das hipóteses; referências já constavam da edição e não foram recertificadas nesta integração.'
          }
          registry['items'] = [r for r in registry['items'] if r.get('id') != release_id] + [item]
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2)+'\n')
          sys.path.insert(0, str(repo/'scripts_admin'))
          import editorial_gate as gate
          policy = json.loads((repo/'data/editorial/policy.json').read_text())
          issues, index = gate.validate_registry(registry, policy, 'data/editorial/registry.json')
          for relative in paths:
              issues.extend(gate.scan_file(repo, repo/relative, policy, index.get(relative), require_registration=True))
          for relative in ['ecossistema/index.html', 'ecossistema/data/catalog.json', 'docs_usuario/PORTFOLIO_GITHUB/README.md']:
              issues.extend(gate.scan_file(repo, repo/relative, policy, index.get(relative), require_registration=True))
          if issues:
              print(json.dumps([i._asdict() for i in issues], ensure_ascii=False, indent=2))
              raise SystemExit('Gate editorial reprovou; nenhuma publicacao sera forcada')
          print(f'Registro e verificacao editorial aprovados: {len(paths)} arquivos; 17 referencias preexistentes.')
          PY
          git diff --check
      - name: Commit sem sobrescrever alteracoes concorrentes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ecossistema/smd4 data/editorial/registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: registrar procedencia e integrar publicacao SMD-4 ao 360X'
          git pull --rebase origin main
          git push origin HEAD:main
          printf '## Integracao editorial concluida\n\nCommit: `%s`\n\nControles originais preservados. Publicacao publica depende do pipeline existente.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
