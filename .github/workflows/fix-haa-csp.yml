name: Ajustar CSP do módulo HAA

on:
  push:
    branches:
      - feature/hepatite-alcool-associada-2026-09-03
    paths:
      - .github/workflows/fix-haa-csp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/hepatite-alcool-associada-2026-09-03
          fetch-depth: 0
      - name: Autorizar somente métricas oficiais do site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('01_Modulos_Clinicos/Hepatite_Alcool_Associada/index.html')
          text = path.read_text(encoding='utf-8')
          old = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"
          new = "default-src 'self'; img-src 'self' data: https://aldenirrochadeoliveirafilho1989.goatcounter.com; style-src 'self'; script-src 'self' https://gc.zgo.at; connect-src 'self' https://aldenirrochadeoliveirafilho1989.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"
          if old not in text:
              raise SystemExit('CSP original esperada não encontrada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Modulos_Clinicos/Hepatite_Alcool_Associada/index.html
          git commit -m "fix(segurança): alinhar CSP às métricas oficiais"
          git push origin HEAD:feature/hepatite-alcool-associada-2026-09-03
