name: Finalizar apresentação das fotografias
on:
  push:
    branches: [feat/fauna-fotografias-reais-20261022]
    paths: ['.github/workflows/fauna-photo-polish.yml']
permissions:
  contents: read
jobs:
  polish:
    if: github.repository == 'aldenirfilho/aldenirmed89' && github.ref == 'refs/heads/feat/fauna-fotografias-reais-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fauna-fotografias-reais-20261022
          sparse-checkout: |
            apps/bolsa-ajuda-fauna
            scripts_admin
            data/editorial
            .github/workflows
      - name: Remover sobreposição ilustrativa antiga e versionar recursos
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path.cwd();app=root/'apps/bolsa-ajuda-fauna'
          assert 'fauna-real-photographs-v1' in (app/'app.js').read_text()
          index=(app/'index.html').read_text()
          assert index.count('href="styles.css"')==1 and index.count('src="app.js"')==1
          index=index.replace('href="styles.css"','href="styles.css?v=20261022-fotos"').replace('src="app.js"','src="app.js?v=20261022-fotos"')
          css=(app/'styles.css').read_text()+'\n.card-art.fauna-photo-art::before,.card-art.fauna-photo-art::after{display:none}\n'
          changes={'index.html':index,'styles.css':css}
          path=root/'data/editorial/registry.json';registry=json.loads(path.read_text())
          entries=[x for x in registry['items'] if x.get('id')=='bolsa-ajuda-fauna-20261022'];assert len(entries)==1
          entry=entries[0];assert entry['ownerApproval'] is True
          for name,text in changes.items():
              rel='apps/bolsa-ajuda-fauna/'+name;assert rel in entry['paths']
              (app/name).write_text(text)
              for e in entry.get('assetEvidence',[]):
                  if e.get('path')==rel and 'sha256' in e: e['sha256']=hashlib.sha256(text.encode()).hexdigest()
          path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 scripts_admin/editorial_gate.py --check --changed-file apps/bolsa-ajuda-fauna/index.html --changed-file apps/bolsa-ajuda-fauna/styles.css --json
      - name: Gravar somente correções do módulo e remover este workflow temporário
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bolsa-ajuda-fauna/index.html apps/bolsa-ajuda-fauna/styles.css data/editorial/registry.json
          git rm -- .github/workflows/fauna-photo-polish.yml
          git commit -m 'fix(fauna): remove decorative overlays and refresh photo asset cache'
          git push origin HEAD:refs/heads/feat/fauna-fotografias-reais-20261022
