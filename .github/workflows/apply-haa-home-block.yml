name: Normalizar cartões clínicos na homepage

on:
  push:
    branches: [main]
    paths:
      - scripts_admin/insert_haa_home_block.py
      - scripts_admin/normalize_haa_discovery_card.py
      - .github/workflows/apply-haa-home-block.yml

permissions:
  contents: write

concurrency:
  group: apply-haa-home-block
  cancel-in-progress: false

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalizar HAA e genética como cartões convencionais
        run: python3 scripts_admin/insert_haa_home_block.py

      - name: Verificar entrada histórica do normalizador
        run: python3 scripts_admin/normalize_haa_discovery_card.py

      - name: Validar integração, idempotência e taxonomia
        run: |
          git diff --check
          python3 -m unittest \
            tests.test_home_clinical_sections \
            tests.test_clarity_home_coverage.ClarityHomeCoverageTests.test_all_home_module_entrypoints_are_covered \
            tests.test_platform_expansion.AccessiblePwaTests.test_portal_stations_and_modules_have_distinct_visual_taxonomy \
            -v

      - name: Commitar somente a homepage quando houver normalização
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(home): normalizar cartões HAA e genética"
          git push origin HEAD:main
