name: Sincronizar manifesto legado HAA

on:
  push:
    branches:
      - feature/hepatite-alcool-associada-2026-09-03
    paths:
      - .github/workflows/sync-haa-public-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/hepatite-alcool-associada-2026-09-03
          fetch-depth: 0
      - name: Sincronizar manifesto de compatibilidade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_site/data
          cp data/site_manifest.json public_site/data/site_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_site/data/site_manifest.json
          git commit -m "fix(manifest): sincronizar espelho público legado"
          git push origin HEAD:feature/hepatite-alcool-associada-2026-09-03
