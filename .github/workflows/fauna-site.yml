name: Validar Bolsa de Ajuda Fauna
on:
  push:
    branches: [feat/bolsa-ajuda-fauna-20261022]
    paths:
      - 'apps/bolsa-ajuda-fauna/**'
      - 'tests/test_fauna_site.py'
      - '.github/workflows/fauna-site.yml'
  pull_request:
    paths:
      - 'apps/bolsa-ajuda-fauna/**'
      - 'tests/test_fauna_site.py'
      - '.github/workflows/fauna-site.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validar catálogo e estrutura
        run: |
          if [ -f tests/test_fauna_site.py ]; then
            python3 -m unittest discover -s tests -p 'test_fauna_site.py' -v
            node --check apps/bolsa-ajuda-fauna/app.js
          fi
      - name: Contexto temporário de integração
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: fauna-development-context
          retention-days: 1
          path: |
            apps/index.html
            data/editorial/registry.json
            data/editorial/policy.json
            data/editorial/editorial-provenance.json
            ecossistema/data/catalog.json
            scripts_admin/editorial_gate.py
            scripts_admin/svg_safety.py
            scripts_admin/build_public_site.py
            scripts_admin/publication_guard.py
            scripts_admin/audit_public_links.py
