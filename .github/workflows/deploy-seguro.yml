name: Deploy GitHub Pages (Seguro v2)

# ──────────────────────────────────────────────────────────────────────────
# CORREÇÃO 2026-06 — Antigravity / Enciclomedia Médica
#
# O QUE MUDOU (e por quê):
#  1. PASSA A COPIAR `06_Infra_Site_E_Assets/`  -> a home referencia o CSS/JS
#     daqui (home-landing.css / .js / data/home-manifest.json). A versão antiga
#     NÃO copiava esta pasta => a home ia ao ar SEM ESTILO e SEM busca de tópicos.
#  2. PASSA A COPIAR `data/`  -> connections.json, topics.json, site_manifest.json,
#     route_aliases.json. Sem isto o Mapa Vivo (D3) e a navegação dinâmica quebram.
#  3. PASSA A COPIAR `les-autoanticorpos/`  -> módulo citado no registry/manifests.
#  4. PARA DE ANINHAR `public_site/` dentro do artefato -> isso criava um site
#     fantasma duplicado em /public_site/ (387 MB) idêntico à raiz.
#  5. NÃO commitar/servir a pasta `site/` (é artefato de build, regenerado aqui).
#  6. REMOVE arquivos de bastidor do artefato público (instruções Antigravity,
#     prompts privados, pastas _private/) — regra inviolável do projeto.
#  7. `/biblioteca/` vira REDIRECT leve (wrapper) em vez de cópia integral da
#     Biblioteca IA -> evita publicar 168 MB duas vezes.
#  8. ATUALIZADO (Por Antigravity IA): As pastas originais foram renomeadas para a
#     arquitetura 01_UpDown_Hub, 02_Biblioteca_IA_Engine, etc.
#
# Nenhum arquivo do repositório é apagado por este workflow: ele apenas monta
# uma pasta `site/` temporária no runner e publica essa pasta.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Restaurar cache OCR público por SHA e configuração
        uses: actions/cache@v4
        with:
          path: .cache/library-ocr-v1
          key: library-ocr-v1-${{ runner.os }}-${{ hashFiles('scripts_admin/build_library_previews.py', '02_Biblioteca_IA_Engine/data/biblioteca_documentos_manifest.json') }}
          restore-keys: |
            library-ocr-v1-${{ runner.os }}-

      - name: Instalar renderizador PDF e OCR local
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por

      - name: Compilar desafios, mnemônicos e indexar hubs de conteúdo
        run: |
          set -e
          python3 scripts_admin/build_desafios.py
          python3 scripts_admin/build_mnemonicos.py
          python3 02_Biblioteca_IA_Engine/scan_biblioteca.py
          python3 scripts_admin/build_library_previews.py
          python3 scripts_admin/build_library_connections.py
          python3 scripts_admin/scan_card_feed.py
          python3 scripts_admin/build_connections.py
          for hub in 04_Ebooks_Intensiva_Clinica 07_Questoes_Comentadas 08_Transcricoes 09_POCUS_Hub; do
            if [ -d "$hub" ]; then
              python3 scripts_admin/scan_content_module.py "$hub"
            fi
          done

      - name: Validar manifests e paths antes do deploy
        run: |
          set -e
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts_admin/check_static_manifests.py
          python3 scripts_admin/update_library_publication_baseline.py --check
          python3 scripts_admin/build_library_previews.py --check
          python3 scripts_admin/validar_paths.py --check
          python3 scripts/validate_routes.py
          python3 scripts_admin/publication_guard.py check-repository .

      - name: Montar pasta publica limpa (allowlist)
        run: |
          set -e
          python3 scripts_admin/build_public_site.py . site
          python3 scripts_admin/publication_guard.py sanitize-site site
          python3 scripts_admin/publication_guard.py check-site site
          test -f site/admin/desafios.html
          test -f site/data/desafios.json
          test -f site/desafios/index.html
          test -s site/favicon.ico
          test -f site/02_Biblioteca_IA_Engine/index.html
          test -f site/02_Biblioteca_IA_Engine/recovery-review-dashboard.html
          test -s site/02_Biblioteca_IA_Engine/data/authorial_recovery_public_summary.json
          test -s site/02_Biblioteca_IA_Engine/data/biblioteca_previews.json
          test "$(find site/02_Biblioteca_IA_Engine/previews -type f -name '*.html' | wc -l)" -gt 0
          test ! -e site/.cache
          test -s site/questoes/data/hub_qbanks.js

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
