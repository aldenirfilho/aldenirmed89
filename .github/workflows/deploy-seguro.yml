name: Deploy GitHub Pages (Seguro v2)

# ──────────────────────────────────────────────────────────────────────────
# CORREÇÃO 2026-06 — Antigravity / Enciclomedia Médica
#
# O QUE MUDOU (e por quê):
#  1. PASSA A COPIAR `06_Infra_Site_E_Assets/`  -> a home referencia o CSS/JS
#     daqui (home-landing.css / .js / data/home-manifest.json). A versão antiga
#     NÃO copiava esta pasta => a home ia ao ar SEM ESTILO e SEM busca de tópicos.
#  2. PASSA A COPIAR `data/`  -> connections.json, topics.json, site_manifest.json,
#     route_aliases.json. Sem isto o Mapa Vivo (D3) e a navegação dinâmica quebram.
#  3. PASSA A COPIAR `les-autoanticorpos/`  -> módulo citado no registry/manifests.
#  4. PARA DE ANINHAR `public_site/` dentro do artefato -> isso criava um site
#     fantasma duplicado em /public_site/ (387 MB) idêntico à raiz.
#  5. NÃO commitar/servir a pasta `site/` (é artefato de build, regenerado aqui).
#  6. REMOVE arquivos de bastidor do artefato público (instruções Antigravity,
#     prompts privados, pastas _private/) — regra inviolável do projeto.
#  7. `/biblioteca/` vira REDIRECT leve (wrapper) em vez de cópia integral da
#     Biblioteca IA -> evita publicar 168 MB duas vezes.
#  8. ATUALIZADO (Por Antigravity IA): As pastas originais foram renomeadas para a
#     arquitetura 01_UpDown_Hub, 02_Biblioteca_IA_Engine, etc.
#
# Nenhum arquivo do repositório é apagado por este workflow: ele apenas monta
# uma pasta `site/` temporária no runner e publica essa pasta.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Restaurar cache OCR público por SHA e configuração
        uses: actions/cache@v4
        with:
          path: .cache/library-ocr-v1
          key: library-ocr-v1-${{ runner.os }}-${{ hashFiles('scripts_admin/build_library_previews.py', '02_Biblioteca_IA_Engine/data/biblioteca_documentos_manifest.json') }}
          restore-keys: |
            library-ocr-v1-${{ runner.os }}-

      - name: Instalar renderizador PDF e OCR local
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por

      - name: Compilar desafios, mnemônicos e indexar hubs de conteúdo
        run: |
          set -e
          python3 scripts_admin/build_desafios.py
          python3 scripts_admin/build_mnemonicos.py
          python3 02_Biblioteca_IA_Engine/scan_biblioteca.py
          python3 scripts_admin/build_library_previews.py
          python3 scripts_admin/build_library_connections.py
          python3 scripts_admin/scan_card_feed.py
          python3 scripts_admin/build_connections.py
          for hub in 04_Ebooks_Intensiva_Clinica 07_Questoes_Comentadas 08_Transcricoes 09_POCUS_Hub; do
            if [ -d "$hub" ]; then
              python3 scripts_admin/scan_content_module.py "$hub"
            fi
          done

      - name: Validar manifests e paths antes do deploy
        run: |
          set -e
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/validate_clinical_catalogs.js
          python3 scripts_admin/check_static_manifests.py
          python3 scripts_admin/update_library_publication_baseline.py --check
          python3 scripts_admin/build_library_previews.py --check
          python3 scripts_admin/validar_paths.py --check
          python3 scripts/validate_routes.py
          python3 scripts_admin/publication_guard.py check-repository .

      - name: Montar pasta publica limpa (allowlist)
        run: |
          set -e
          python3 scripts_admin/build_public_site.py . site
          python3 scripts_admin/publication_guard.py sanitize-site site
          python3 scripts_admin/publication_guard.py check-site site
          test -f site/admin/desafios.html
          test -f site/data/desafios.json
          test -f site/desafios/index.html
          test -s site/favicon.ico
          test -f site/02_Biblioteca_IA_Engine/index.html
          test -f site/02_Biblioteca_IA_Engine/recovery-review-dashboard.html
          test -s site/02_Biblioteca_IA_Engine/data/authorial_recovery_public_summary.json
          test -s site/02_Biblioteca_IA_Engine/data/biblioteca_previews.json
          test "$(find site/02_Biblioteca_IA_Engine/previews -type f -name '*.html' | wc -l)" -gt 0
          test ! -e site/.cache
          test -s site/questoes/data/hub_qbanks.js
          test -s site/manifest.webmanifest
          test -s site/sw.js
          test -s site/offline.html
          test -s site/assets/icons/antigravity-consultas-192.png
          test -s site/assets/icons/antigravity-consultas-512.png
          test -s site/assets/icons/apple-touch-icon.png
          test -s site/assets/icons/ios/apple-touch-icon-120.png
          test -s site/assets/icons/ios/apple-touch-icon-152.png
          test -s site/assets/icons/ios/apple-touch-icon-167.png
          test -s site/assets/icons/ios/apple-touch-icon-180.png
          test -s site/assets/icons/ios/apple-touch-icon-1024.png
          test -s site/01_Modulos_Clinicos/Hematologia_Critica/index.html
          test -s site/01_Modulos_Clinicos/Reumatologia_Critica/index.html
          test -s site/01_Modulos_Clinicos/Delirium_UTI/index.html
          test -s site/01_Modulos_Clinicos/Delirium_UTI/CHECKLIST_OPERACIONAL.md
          test -s site/docs_usuario/ALIMENTAR_CONTEUDO_SITE.md
          test -s site/docs_usuario/OPERACAO_CONTINUA.md
          test -s site/docs_usuario/ACESSO_DOCK_MAC.md
          test -s site/docs_usuario/ACESSO_WINDOWS.md
          test -s site/docs_usuario/ACESSO_IPHONE.md
          test -s site/docs_usuario/index.html
          test -s site/docs_usuario/guide-reader.css
          test -s site/docs_usuario/guide-reader.js
          test -s site/docs_usuario/ALIMENTAR_CONTEUDO_SITE/index.html
          test -s site/docs_usuario/OPERACAO_CONTINUA/index.html
          test -s site/docs_usuario/ACESSO_DOCK_MAC/index.html
          test -s site/docs_usuario/ACESSO_WINDOWS/index.html
          test -s site/docs_usuario/ACESSO_IPHONE/index.html
          test -s site/downloads/Antigravity-Consultas-macOS.zip
          test -s site/downloads/Antigravity-Consultas-Windows.zip
          test -s site/downloads/Antigravity-Consultas-iPhone-Icones.zip
          unzip -t site/downloads/Antigravity-Consultas-macOS.zip
          unzip -t site/downloads/Antigravity-Consultas-Windows.zip
          unzip -t site/downloads/Antigravity-Consultas-iPhone-Icones.zip
          (cd site/downloads && sha256sum -c SHA256SUMS.txt)

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

  windows-launcher:
    name: Validar launcher no Windows
    runs-on: windows-latest

    steps:
      - name: Baixar pacote e checksum do commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '${{ github.event.pull_request.head.sha || github.sha }}'
          $baseUrl = "https://raw.githubusercontent.com/${{ github.repository }}/$commit/downloads"
          New-Item -ItemType Directory -Path 'downloads' -Force | Out-Null
          foreach ($filename in @(
            'Antigravity-Consultas-Windows.zip',
            'SHA256SUMS.txt'
          )) {
            & curl.exe --fail --location --retry 3 `
              --output (Join-Path 'downloads' $filename) `
              "$baseUrl/$filename"
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao baixar $filename do commit $commit."
            }
          }

      - name: Instalar, conferir e desinstalar em perfil padrão
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'downloads/Antigravity-Consultas-Windows.zip'
          $checksumLine = Get-Content 'downloads/SHA256SUMS.txt' |
            Where-Object { $_ -match '  Antigravity-Consultas-Windows\.zip$' }
          if (@($checksumLine).Count -ne 1) {
            throw 'Checksum Windows ausente ou duplicado.'
          }
          $expected = ($checksumLine -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw 'Checksum Windows divergente.'
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'antigravity-windows'
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $package = Join-Path $extractRoot 'Antigravity-Consultas-Windows'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'

          & $windowsPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File (Join-Path $package 'app\Instalar.ps1')
          if ($LASTEXITCODE -ne 0) {
            throw "Instalador terminou com codigo $LASTEXITCODE."
          }

          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) `
            'Antigravity Consultas.lnk'
          $startMenuDirectory = Join-Path ([Environment]::GetFolderPath('Programs')) `
            'Antigravity Consultas'
          $startShortcut = Join-Path $startMenuDirectory 'Antigravity Consultas.lnk'
          $uninstallShortcut = Join-Path $startMenuDirectory `
            'Desinstalar Antigravity Consultas.lnk'
          foreach ($shortcut in @($desktopShortcut, $startShortcut, $uninstallShortcut)) {
            if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) {
              throw "Atalho esperado ausente: $shortcut"
            }
          }

          $installDirectory = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) `
            'Antigravity Consultas'
          $sentinel = Join-Path $installDirectory 'arquivo-desconhecido.txt'
          [IO.File]::WriteAllText($sentinel, 'preservar')

          & $windowsPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File (Join-Path $installDirectory 'Desinstalar.ps1')
          if ($LASTEXITCODE -ne 0) {
            throw "Desinstalador terminou com codigo $LASTEXITCODE."
          }
          if (Test-Path -LiteralPath $desktopShortcut) {
            throw 'Atalho do Desktop permaneceu após desinstalação.'
          }
          if (Test-Path -LiteralPath (Join-Path $installDirectory 'Abrir-Antigravity.cmd')) {
            throw 'Launcher conhecido permaneceu após desinstalação.'
          }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw 'Arquivo desconhecido não foi preservado.'
          }

          Remove-Item -LiteralPath $sentinel -Force
          Remove-Item -LiteralPath $installDirectory -Force
          Write-Host 'Launcher Windows validado com instalação e desinstalação reversíveis.'

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, windows-launcher]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
