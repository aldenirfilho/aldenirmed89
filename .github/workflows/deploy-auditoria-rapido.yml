name: Deploy rápido — Auditoria Religiosa 360

on:
  push:
    branches:
      - main
    paths:
      - "ecossistema/auditoria-religiosa-360/**"
      - ".github/workflows/deploy-auditoria-rapido.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-auditoria-fast
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Gerar índices estáticos necessários
        run: |
          set -e
          python3 scripts_admin/build_desafios.py
          python3 scripts_admin/build_mnemonicos.py
          python3 02_Biblioteca_IA_Engine/scan_biblioteca.py
          python3 scripts_admin/build_library_previews.py
          python3 scripts_admin/build_library_connections.py
          python3 scripts_admin/scan_card_feed.py
          python3 scripts_admin/build_connections.py
          for hub in 04_Ebooks_Intensiva_Clinica 07_Questoes_Comentadas 08_Transcricoes 09_POCUS_Hub; do
            if [ -d "$hub" ]; then
              python3 scripts_admin/scan_content_module.py "$hub"
            fi
          done

      - name: Montar site público pela allowlist existente
        run: |
          set -e
          python3 scripts_admin/build_public_site.py . site
          test -s site/ecossistema/auditoria-religiosa-360/index.html
          test -s site/ecossistema/auditoria-religiosa-360/cenario-atual.html
          test -s site/ecossistema/auditoria-religiosa-360/agentes.html
          test -s site/ecossistema/auditoria-religiosa-360/dossie-igreja-mormon.html
          test -s site/ecossistema/auditoria-religiosa-360/comparativo-interreligioso.html
          test -s site/ecossistema/auditoria-religiosa-360/comparativo-interreligioso/index.html
          test -s site/ecossistema/auditoria-religiosa-360/assets/comparativo-interreligioso.css
          test -s site/ecossistema/auditoria-religiosa-360/assets/comparativo-interreligioso.js
          test -s site/ecossistema/auditoria-religiosa-360/data/comparativo-interreligioso-patrimonio-360x.json

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar rota pública do comparativo
        env:
          ROUTE: https://aldenirfilho.github.io/aldenirmed89/ecossistema/auditoria-religiosa-360/comparativo-interreligioso/
        run: |
          set -e
          for tentativa in $(seq 1 24); do
            codigo="$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/comparativo.html -w '%{http_code}' "${ROUTE}?build=${GITHUB_SHA}&attempt=${tentativa}" || true)"
            if [ "$codigo" = "200" ] && grep -qi "Comparativo inter-religioso" /tmp/comparativo.html; then
              echo "Rota pública confirmada com HTTP 200."
              exit 0
            fi
            echo "Tentativa ${tentativa}: HTTP ${codigo:-sem-resposta}."
            sleep 10
          done
          echo "A rota pública não foi confirmada após o deploy."
          exit 1
