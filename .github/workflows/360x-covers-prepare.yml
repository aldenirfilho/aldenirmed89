name: Preparar capas Turbo 360X
on:
  push:
    branches: [feat/360x-vivid-site-covers-20261022]
    paths: ['.github/workflows/360x-covers-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/360x-vivid-site-covers-20261022
          fetch-depth: 1
      - name: Gerar somente as capas e sua apresentação
        run: |
          set -e
          python3 scripts_admin/refresh_360x_covers.py > /tmp/360x-covers.json
          python3 -m unittest discover -s tests -p 'test_360x_turbo_covers.py' -v
          python3 -m unittest discover -s tests -p 'test_universo_360x.py' -v
          python3 -m unittest discover -s tests -p 'test_mapa_360x.py' -v
          python3 -m unittest discover -s tests -p 'test_fauna_ecossistema.py' -v
          python3 - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/360x-covers.json'))['public_paths']
          cmd=['python3','scripts_admin/editorial_gate.py','--check','--json']
          for path in paths:cmd+=['--changed-file',path]
          subprocess.run(cmd,check=True)
          PY
      - name: Preparar navegador de verificação
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Testar as imagens, os filtros e as telas móveis
        run: python3 scripts_admin/check_360x_covers_browser.py
      - name: Preservar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-360x-cover-verification
          retention-days: 7
          path: |
            cover-browser-check/
            ecossistema/assets/previews/turbo-360x-v1/
      - name: Registrar somente o escopo validado
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ecossistema/assets/previews/turbo-360x-v1 ecossistema/assets/styles.css ecossistema/data/sites-360x.json ecossistema/index.html data/editorial/registry.json
          git rm .github/workflows/360x-covers-prepare.yml
          git diff --cached --check
          git commit -m 'feat(visual): apply 24 tested Turbo 360X site covers'
          git push origin HEAD:feat/360x-vivid-site-covers-20261022
