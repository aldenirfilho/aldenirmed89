<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" class="ilus" role="img" aria-label="Coluna estratigráfica simplificada da Bacia do Araripe"><defs><pattern id="pa" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#8a7444"/><circle cx="9" cy="8" r="1" fill="#8a7444"/></pattern><pattern id="pl" width="14" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="2.5" x2="14" y2="2.5" stroke="#9c8f74" stroke-width=".8"/></pattern><pattern id="pf" width="14" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="9" y2="3" stroke="#2e2b26" stroke-width="1"/></pattern><pattern id="pg" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M3,3 l4,4 M7,3 l-4,4 M10,10 l3,3 M13,10 l-3,3" stroke="#b9ad94" stroke-width=".9"/></pattern><pattern id="pn" width="40" height="22" patternUnits="userSpaceOnUse"><ellipse cx="12" cy="11" rx="9" ry="4.5" fill="#d7d3c0" stroke="#7d7869"/><line x1="0" y1="19" x2="40" y2="19" stroke="#8f8b7c" stroke-width=".6"/></pattern><pattern id="ps" width="10" height="8" patternUnits="userSpaceOnUse"><line x1="0" y1="4" x2="6" y2="4" stroke="#9c8a63" stroke-width=".8"/></pattern></defs><g font-family="Atkinson Hyperlegible,sans-serif"><text x="40" y="12" font-size="12" fill="#a9b2ac">mais novo ↑ · idades aproximadas, em debate</text><rect x="40" y="20.0" width="150" height="90.9" fill="#e3c98f"/><rect x="40" y="20.0" width="150" height="90.9" fill="url(#pa)" stroke="#a9b2ac" stroke-width=".8"/><line x1="190" y1="65.5" x2="218" y2="65.5" stroke="#a9b2ac" stroke-width="0.8"/><text x="226" y="59.5" font-size="16" font-weight="700" fill="#ece3cc" font-family="Cinzel,serif">Formação Exu</text><text x="226" y="78.5" font-size="13" fill="#a9b2ac">topo da Chapada · arenitos de antigos rios</text><rect x="40" y="110.9" width="150" height="57.9" fill="#d9c4a0"/><rect x="40" y="110.9" width="150" height="57.9" fill="url(#ps)" stroke="#a9b2ac" stroke-width=".8"/><line x1="190" y1="139.8" x2="218" y2="139.8" stroke="#a9b2ac" stroke-width="0.8"/><text x="226" y="133.8" font-size="16" font-weight="700" fill="#ece3cc" font-family="Cinzel,serif">Formação Arajara</text><text x="226" y="152.8" font-size="13" fill="#a9b2ac">siltitos e arenitos finos</text><rect x="40" y="168.8" width="150" height="107.4" fill="#b9b7a6"/><rect x="40" y="168.8" width="150" height="107.4" fill="url(#pn)" stroke="#a9b2ac" stroke-width=".8"/><line x1="190" y1="222.5" x2="218" y2="222.5" stroke="#d9b45a" stroke-width="1.4"/><text x="226" y="216.5" font-size="16" font-weight="700" fill="#d9b45a" font-family="Cinzel,serif">Formação Romualdo · topo</text><text x="226" y="235.5" font-size="13" fill="#a9b2ac">Aptiano (revisão recente) · nódulos calcários: Irritator, Angaturama, Santanaraptor, Mirischia</text><text x="226" y="251.5" font-size="13" fill="#a9b2ac">peixes em 3D e pterossauros</text><rect x="40" y="276.2" width="150" height="45.5" fill="#5e5a52"/><rect x="40" y="276.2" width="150" height="45.5" fill="url(#pf)" stroke="#a9b2ac" stroke-width=".8"/><line x1="190" y1="298.9" x2="218" y2="298.9" stroke="#d9b45a" stroke-width="1.4"/><text x="226" y="292.9" font-size="16" font-weight="700" fill="#d9b45a" font-family="Cinzel,serif">Formação Romualdo · base</text><text x="226" y="311.9" font-size="13" fill="#a9b2ac">≈ 115 milhões de anos · folhelho escuro: Aratasaurus, o único tetrápode conhecido deste nível</text><rect x="40" y="321.7" width="150" height="49.6" fill="#f1eee6"/><rect x="40" y="321.7" width="150" height="49.6" fill="url(#pg)" stroke="#a9b2ac" stroke-width=".8"/><line x1="190" y1="346.4" x2="218" y2="346.4" stroke="#a9b2ac" stroke-width="0.8"/><text x="226" y="340.4" font-size="16" font-weight="700" fill="#ece3cc" font-family="Cinzel,serif">Formação Ipubi</text><text x="226" y="359.4" font-size="13" fill="#a9b2ac">gipsita (gesso), explorada em minas</text><rect x="40" y="371.2" width="150" height="82.6" fill="#d8cfb3"/><rect x="40" y="371.2" width="150" height="82.6" fill="url(#pl)" stroke="#a9b2ac" stroke-width=".8"/><line x1="190" y1="412.6" x2="218" y2="412.6" stroke="#d9b45a" stroke-width="1.4"/><text x="226" y="406.6" font-size="16" font-weight="700" fill="#d9b45a" font-family="Cinzel,serif">Formação Crato</text><text x="226" y="425.6" font-size="13" fill="#a9b2ac">Aptiano · ≈ 115 milhões de anos · calcário laminado: “Ubirajara”, Cratoavis, Kaririavis</text><text x="226" y="441.6" font-size="13" fill="#a9b2ac">insetos, peixes, pterossauros e penas isoladas</text><rect x="40" y="453.9" width="150" height="66.1" fill="#e3c98f"/><rect x="40" y="453.9" width="150" height="66.1" fill="url(#pa)" stroke="#a9b2ac" stroke-width=".8"/><line x1="190" y1="486.9" x2="218" y2="486.9" stroke="#a9b2ac" stroke-width="0.8"/><text x="226" y="480.9" font-size="16" font-weight="700" fill="#ece3cc" font-family="Cinzel,serif">Formação Barbalha</text><text x="226" y="499.9" font-size="13" fill="#a9b2ac">arenitos e folhelhos de rios e lagos</text><text x="40" y="538.0" font-size="12" fill="#a9b2ac">mais antigo ↓</text><path d="M32,22.0 q-8,0 -8,8 v128.8 q0,8 8,8" fill="none" stroke="#3ccfd0" stroke-width="1.6"/><text transform="translate(18,94.4) rotate(-90)" font-size="12" fill="#3ccfd0" text-anchor="middle" font-weight="700">Grupo Araripe</text><path d="M32,170.8 q-8,0 -8,8 v331.2 q0,8 8,8" fill="none" stroke="#3ccfd0" stroke-width="1.6"/><text transform="translate(18,344.4) rotate(-90)" font-size="12" fill="#3ccfd0" text-anchor="middle" font-weight="700">Grupo Santana</text></g></svg>