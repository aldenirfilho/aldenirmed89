  <title id="title">Códice das Eras Perdidas · Mistérios Antigos 360X</title>
  <desc id="desc">Livro aberto com uma engrenagem ciano na página esquerda e uma espiral de amonite dourada na direita, cercado por uma órbita tracejada. Composição vetorial conceitual sobre fósseis, tecnologia antiga e tempo profundo.</desc>
