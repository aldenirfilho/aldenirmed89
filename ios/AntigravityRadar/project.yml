name: AntigravityRadar
options:
  bundleIdPrefix: com.aldenirfilho.antigravity
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  AntigravityRadar:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    resources:
      - path: ../../15_Radar_Cientifico/data/radar-widget-feed.json
    info:
      path: App/Info.plist
    entitlements:
      path: App/AntigravityRadar.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aldenirfilho.antigravity.radar
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: RadarDiarioWidget
        embed: true
  RadarDiarioWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    resources:
      - path: ../../15_Radar_Cientifico/data/radar-widget-feed.json
    info:
      path: Widget/Info.plist
    entitlements:
      path: Widget/RadarDiarioWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aldenirfilho.antigravity.radar.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
